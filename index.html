<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Clocktower en Ligne</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e94560;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #16213e;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .hidden {
            display: none;
        }
        h1 {
            margin-bottom: 1.5rem;
            color: #e94560;
        }
        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 5px;
            background-color: #0f3460;
            color: white;
            box-sizing: border-box;
        }
        input:focus {
            outline: 2px solid #e94560;
        }
        button {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 5px;
            background-color: #e94560;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 1rem;
        }
        button:hover {
            background-color: #cf3a54;
        }
        .footer {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #533483;
        }
        .footer a {
            color: inherit;
            text-decoration: none;
        }
        .message {
            min-height: 1.2rem;
            margin: 1rem 0 0;
            color: #f5c542;
            font-size: 0.9rem;
        }
        .lobby-password {
            margin: 1rem 0;
            padding: 0.8rem;
            background-color: #0f3460;
            color: white;
            font-weight: bold;
            letter-spacing: 0.08rem;
        }
        .players {
            margin: 1.5rem 0;
            padding: 0;
            color: white;
            list-style: none;
        }
        .players li {
            padding: 0.45rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body>
    <div class="container" id="home-view">
        <h1>Blood on the Clocktower</h1>
        <form id="join-form">
            <div class="form-group">
                <label for="pseudo">Votre Pseudo</label>
                <input type="text" id="pseudo" name="pseudo" placeholder="Ex: Jean_Michel" required>
            </div>
            <div class="form-group">
                <label for="game-password">Mot de passe de la partie</label>
                <input type="password" id="game-password" name="game-password" placeholder="Mot de passe commun" required>
            </div>
            <button type="submit">Rejoindre la partie</button>
        </form>
        <p class="message" id="message" role="status"></p>
        <div class="footer">
            <a href="#" id="create-game">Créer une partie</a>
        </div>
    </div>

    <div class="container hidden" id="lobby-view">
        <h1>Lobby</h1>
        <p>Mot de passe de la partie :</p>
        <div class="lobby-password" id="lobby-password"></div>
        <h2>Joueurs connectés</h2>
        <ul class="players" id="players-list"></ul>
        <button type="button" id="leave-lobby">Quitter le lobby</button>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
        import {
            arrayRemove,
            collection,
            deleteDoc,
            doc,
            getDoc,
            getDocs,
            getFirestore,
            limit,
            onSnapshot,
            query,
            runTransaction,
            serverTimestamp,
            updateDoc,
            where,
            writeBatch
        } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyDF5NAQxCnR1k3znzhOImNCeJn0jD2EqTM',
            authDomain: 'botc-database-gamemaster.firebaseapp.com',
            projectId: 'botc-database-gamemaster',
            storageBucket: 'botc-database-gamemaster.firebasestorage.app',
            messagingSenderId: '1089060485131',
            appId: '1:1089060485131:web:21c8fa56a336901ddc6f0e'
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const homeView = document.getElementById('home-view');
        const lobbyView = document.getElementById('lobby-view');
        const joinForm = document.getElementById('join-form');
        const pseudoInput = document.getElementById('pseudo');
        const passwordInput = document.getElementById('game-password');
        const message = document.getElementById('message');
        const lobbyPassword = document.getElementById('lobby-password');
        const playersList = document.getElementById('players-list');
        const gamesCollectionName = 'games';
        const playerId = sessionStorage.getItem('botc-player-id') || crypto.randomUUID();
        let currentPlayer = null;
        let currentLobbyId = '';
        let stopLobbyListener = null;

        sessionStorage.setItem('botc-player-id', playerId);

        function showMessage(text) {
            message.textContent = text;
        }

        function renderLobby(lobby) {
            lobbyPassword.textContent = lobby.password;
            playersList.innerHTML = '';

            (lobby.players || []).forEach(function(player) {
                const playerItem = document.createElement('li');
                playerItem.textContent = player.pseudo;
                playersList.appendChild(playerItem);
            });
        }

        function subscribeToLobby(lobbyId) {
            if (stopLobbyListener) {
                stopLobbyListener();
            }

            currentLobbyId = lobbyId;
            sessionStorage.setItem('botc-lobby-id', lobbyId);
            stopLobbyListener = onSnapshot(doc(db, gamesCollectionName, lobbyId), function(snapshot) {
                if (!snapshot.exists()) {
                    leaveLobbyView();
                    showMessage('Cette partie n’est plus disponible.');
                    return;
                }

                renderLobby(snapshot.data());
            }, function() {
                showMessage('Impossible de suivre les changements du lobby.');
            });
        }

        function enterLobby(lobbyId, player) {
            currentPlayer = player;
            homeView.classList.add('hidden');
            lobbyView.classList.remove('hidden');
            showMessage('');
            subscribeToLobby(lobbyId);
        }

        function leaveLobbyView() {
            if (stopLobbyListener) {
                stopLobbyListener();
                stopLobbyListener = null;
            }

            currentLobbyId = '';
            currentPlayer = null;
            sessionStorage.removeItem('botc-lobby-id');
            lobbyView.classList.add('hidden');
            homeView.classList.remove('hidden');
        }

        async function ensureSignedIn() {
            if (!auth.currentUser) {
                await signInAnonymously(auth);
            }
        }

        function createPlayerData(pseudo) {
            return {
                pseudo: pseudo,
                isAlive: true,
                role: '',
                secondaryRole: '',
                lastVote: false,
                createdAt: serverTimestamp()
            };
        }

        function getPlayerReference(lobbyId) {
            return doc(db, gamesCollectionName, lobbyId, 'players', playerId);
        }

        async function cleanOldGames() {
            const expirationDate = new Date(Date.now() - 6 * 60 * 60 * 1000);
            const oldGamesQuery = query(
                collection(db, gamesCollectionName),
                where('createdAt', '<', expirationDate)
            );
            const oldGamesSnapshot = await getDocs(oldGamesQuery);

            for (const gameDocument of oldGamesSnapshot.docs) {
                const playersSnapshot = await getDocs(
                    collection(db, gamesCollectionName, gameDocument.id, 'players')
                );

                if (playersSnapshot.empty) {
                    await deleteDoc(gameDocument.ref);
                    continue;
                }

                for (let index = 0; index < playersSnapshot.docs.length; index += 450) {
                    const batch = writeBatch(db);
                    const playerDocuments = playersSnapshot.docs.slice(index, index + 450);

                    playerDocuments.forEach(function(playerDocument) {
                        batch.delete(playerDocument.ref);
                    });

                    if (index + 450 >= playersSnapshot.docs.length) {
                        batch.delete(gameDocument.ref);
                    }

                    await batch.commit();
                }
            }
        }

        document.getElementById('create-game').addEventListener('click', async function(e) {
            e.preventDefault();
            const pseudo = pseudoInput.value.trim();
            let password = passwordInput.value.trim();

            if (!pseudo) {
                showMessage('Veuillez entrer votre pseudo avant de créer une partie.');
                pseudoInput.focus();
                return;
            }

            if (!password) {
                password = Math.random().toString(36).slice(2, 8).toUpperCase();
                passwordInput.value = password;
            }

            try {
                await ensureSignedIn();
                await cleanOldGames();
                const player = { id: playerId, pseudo: pseudo };
                const lobbyReference = doc(collection(db, gamesCollectionName));
                await runTransaction(db, async function(transaction) {
                    transaction.set(lobbyReference, {
                        password: password,
                        hostId: playerId,
                        players: [player],
                        createdAt: serverTimestamp()
                    });
                    transaction.set(getPlayerReference(lobbyReference.id), createPlayerData(pseudo));
                });
                enterLobby(lobbyReference.id, player);
            } catch (error) {
                showMessage('Impossible de créer la partie. Vérifiez la configuration Firebase.');
                console.error(error);
            }
        });

        joinForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const pseudo = pseudoInput.value.trim();
            const password = passwordInput.value.trim();

            if (!pseudo || !password) {
                showMessage('Veuillez entrer votre pseudo et le mot de passe de la partie.');
                return;
            }

            try {
                await ensureSignedIn();
                const lobbyQuery = query(
                    collection(db, gamesCollectionName),
                    where('password', '==', password),
                    limit(1)
                );
                const lobbySnapshot = await getDocs(lobbyQuery);

                if (lobbySnapshot.empty) {
                    showMessage('Aucune partie ne correspond à ce mot de passe.');
                    return;
                }

                const lobbyDocument = lobbySnapshot.docs[0];
                const player = { id: playerId, pseudo: pseudo };
                await runTransaction(db, async function(transaction) {
                    const lobbyReference = doc(db, gamesCollectionName, lobbyDocument.id);
                    const currentLobby = await transaction.get(lobbyReference);
                    const lobbyData = currentLobby.data();
                    const players = lobbyData.players || [];

                    if (players.some(function(existingPlayer) {
                        return existingPlayer.pseudo.toLowerCase() === pseudo.toLowerCase();
                    })) {
                        throw new Error('PSEUDO_DEJA_UTILISE');
                    }

                    transaction.update(lobbyReference, {
                        players: players.concat(player)
                    });
                    transaction.set(getPlayerReference(lobbyDocument.id), createPlayerData(pseudo));
                });
                enterLobby(lobbyDocument.id, player);
            } catch (error) {
                if (error.message === 'PSEUDO_DEJA_UTILISE') {
                    showMessage('Ce pseudo est déjà utilisé dans le lobby.');
                } else {
                    showMessage('Impossible de rejoindre la partie. Vérifiez le mot de passe.');
                    console.error(error);
                }
            }
        });

        document.getElementById('leave-lobby').addEventListener('click', async function() {
            if (!currentLobbyId || !currentPlayer) {
                leaveLobbyView();
                return;
            }

            try {
                const lobbyReference = doc(db, gamesCollectionName, currentLobbyId);
                const lobbySnapshot = await getDoc(lobbyReference);
                const lobby = lobbySnapshot.exists() ? lobbySnapshot.data() : null;

                await deleteDoc(getPlayerReference(currentLobbyId));

                if (lobby && lobby.hostId === currentPlayer.id) {
                    await deleteDoc(lobbyReference);
                } else {
                    await updateDoc(lobbyReference, {
                        players: arrayRemove(currentPlayer)
                    });
                }
            } catch (error) {
                console.error(error);
            } finally {
                leaveLobbyView();
            }
        });

        ensureSignedIn().then(function() {
            const savedLobbyId = sessionStorage.getItem('botc-lobby-id');
            if (savedLobbyId) {
                const lobbyReference = doc(db, gamesCollectionName, savedLobbyId);
                getDoc(lobbyReference).then(function(snapshot) {
                    const lobby = snapshot.data();
                    const savedPlayer = lobby && (lobby.players || []).find(function(player) {
                        return player.id === playerId;
                    });

                    if (savedPlayer) {
                        enterLobby(savedLobbyId, savedPlayer);
                    }
                }).catch(function(error) {
                    console.error(error);
                });
            }
        }).catch(function(error) {
            showMessage('Connexion à Firebase impossible.');
            console.error(error);
        });
    </script>
</body>
</html>
