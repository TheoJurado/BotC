        async function startDay() {
            if (!currentLobbyId || !currentPlayer) {
                return;
            }

            try {
                await runTransaction(db, async function(transaction) {
                    const lobbyReference = doc(db, gamesCollectionName, currentLobbyId);
                    const lobbySnapshot = await transaction.get(lobbyReference);
                    const lobby = lobbySnapshot.data();

                    if (!lobby || lobby.hostId !== currentPlayer.id || lobby.gameIsRunning !== true || lobby.gamePhase !== 'night') {
                        return;
                    }

                    transaction.update(lobbyReference, {
                        gamePhase: 'day',
                        dayEndsAt: Date.now() + dayDurationMs,
                        dayEndVotes: [],
                        accusedPlayerIds: [],
                        lastDayResult: null
                    });
                });
            } catch (error) {
                gameMessage.textContent = 'Impossible de relancer la journée.';
                console.error(error);
            }
        }

        async function startAccusation(targetPlayerId) {
            if (!currentLobbyId || !currentPlayer) {
                return;
            }

            const lobbyReference = doc(db, gamesCollectionName, currentLobbyId);

            try {
                await runTransaction(db, async function(transaction) {
                    const lobbySnapshot = await transaction.get(lobbyReference);
                    const lobby = lobbySnapshot.data();

                    if (!lobby || lobby.gameIsRunning !== true || (lobby.gamePhase || 'day') !== 'day') {
                        throw new Error('ACCUSATION_HORS_JOUR');
                    }

                    if (lobby.activeAccusation) {
                        throw new Error('ACCUSATION_EN_COURS');
                    }

                    const players = Array.isArray(lobby.players) ? lobby.players : [];
                    const eliminatedPlayerIds = Array.isArray(lobby.eliminatedPlayerIds) ? lobby.eliminatedPlayerIds : [];
                    const accuser = players.find(function(player) { return player.id === currentPlayer.id; });
                    const target = players.find(function(player) { return player.id === targetPlayerId; });
                    const deadline = lobby.dayEndsAt && typeof lobby.dayEndsAt.toMillis === 'function'
                        ? lobby.dayEndsAt.toMillis()
                        : Number(lobby.dayEndsAt);

                    if (!accuser || !isPlayerAlive(accuser, eliminatedPlayerIds)) {
                        throw new Error('ACCUSATEUR_ELIMINE');
                    }

                    if (accuser.canAccuse === false) {
                        throw new Error('ACCUSATION_DEJA_UTILISEE');
                    }

                    if (!target || targetPlayerId === currentPlayer.id || !isPlayerAlive(target, eliminatedPlayerIds)) {
                        throw new Error('CIBLE_INVALIDE');
                    }

                    const accusedPlayerIds = Array.isArray(lobby.accusedPlayerIds) ? lobby.accusedPlayerIds : [];
                    if (accusedPlayerIds.includes(targetPlayerId)) {
                        throw new Error('CIBLE_DEJA_ACCUSÉE');
                    }

                    if (!Number.isFinite(deadline) || deadline <= Date.now()) {
                        throw new Error('JOUR_TERMINE');
                    }

                    const accusationStartedAt = Date.now();
                    transaction.update(lobbyReference, {
                        pausedDayTimeMs: deadline - accusationStartedAt,
                        accusedPlayerIds: accusedPlayerIds.concat(targetPlayerId),
                        players: players.map(function(player) {
                            return player.id === currentPlayer.id
                                ? Object.assign({}, player, { canAccuse: false })
                                : player;
                        }),
                        activeAccusation: {
                            id: crypto.randomUUID(),
                            accuserId: currentPlayer.id,
                            targetId: targetPlayerId,
                            startedAt: accusationStartedAt,
                            endsAt: accusationStartedAt + accusationDurationMs,
                            votes: {}
                        }
                    });
                    transaction.update(doc(db, gamesCollectionName, currentLobbyId, 'players', currentPlayer.id), {
                        canAccuse: false
                    });
                });
            } catch (error) {
                gameMessage.textContent = 'Impossible de lancer cette accusation.';
                console.error(error);
            }
        }

        async function castAccusationVote() {
            if (!currentLobbyId || !currentPlayer) {
                return;
            }

            try {
                await runTransaction(db, async function(transaction) {
                    const lobbyReference = doc(db, gamesCollectionName, currentLobbyId);
                    const lobbySnapshot = await transaction.get(lobbyReference);
                    const voterReference = doc(db, gamesCollectionName, currentLobbyId, 'players', currentPlayer.id);
                    const voterSnapshot = await transaction.get(voterReference);
                    const lobby = lobbySnapshot.data();
                    const accusation = lobby && lobby.activeAccusation;
                    const voterData = voterSnapshot.data();

                    if (!lobby || !accusation || (lobby.gamePhase || 'day') !== 'day') {
                        return;
                    }

                    const players = Array.isArray(lobby.players) ? lobby.players : [];
                    const eliminatedPlayerIds = Array.isArray(lobby.eliminatedPlayerIds) ? lobby.eliminatedPlayerIds : [];
                    const voter = players.find(function(player) { return player.id === currentPlayer.id; });
                    if (!voter || !voterData) {
                        return;
                    }

                    const voterAlive = voterData.isAlive !== false && isPlayerAlive(voter, eliminatedPlayerIds);
                    const votes = accusation.votes && typeof accusation.votes === 'object'
                        ? Object.assign({}, accusation.votes)
                        : {};
                    const hasVotedFor = votes[currentPlayer.id] === true;

                    if (!voterAlive) {
                        if (voterData.lastVote !== true || hasVotedFor) {
                            return;
                        }

                        votes[currentPlayer.id] = true;
                        transaction.update(voterReference, { lastVote: false });
                        transaction.update(lobbyReference, {
                            activeAccusation: Object.assign({}, accusation, { votes: votes }),
                            players: players.map(function(player) {
                                return player.id === currentPlayer.id
                                    ? Object.assign({}, player, { lastVote: false })
                                    : player;
                            })
                        });
                        return;
                    }

                    votes[currentPlayer.id] = !hasVotedFor;
                    transaction.update(lobbyReference, {
                        activeAccusation: Object.assign({}, accusation, { votes: votes })
                    });
                });
            } catch (error) {
                accusationStatus.textContent = 'Impossible d’enregistrer votre vote.';
                console.error(error);
            }
        }

        function stopAccusationTimer() {
            if (accusationInterval) {
                clearInterval(accusationInterval);
                accusationInterval = null;
            }

            currentAccusationId = null;
        }

        function startAccusationTimer(accusation, hostId) {
            const deadline = Number(accusation.endsAt);
            const canResolve = Boolean(currentPlayer && currentPlayer.id === hostId);
            
            console.log("[Timer Debug] Initialisation du timer d'accusation :");
            console.log("- Player ID actuel:", currentPlayer ? currentPlayer.id : 'null');
            console.log("- Host ID de la partie:", hostId);
            console.log("- Peut résoudre (canResolve):", canResolve);

            if (!Number.isFinite(deadline) || deadline <= 0) {
                stopAccusationTimer();
                accusationCountdown.textContent = '--:--';
                return;
            }

            if (currentAccusationId === accusation.id && accusationInterval) {
                updateAccusationTimer(accusation, canResolve);
                return;
            }

            stopAccusationTimer();
            currentAccusationId = accusation.id;
            updateAccusationTimer(accusation, canResolve);
            accusationInterval = setInterval(function() {
                updateAccusationTimer(accusation, canResolve);
            }, 1000);
        }

        function updateAccusationTimer(accusation, canResolve) {
            const remainingMs = Math.max(0, Number(accusation.endsAt) - Date.now());
            const remainingSeconds = Math.ceil(remainingMs / 1000);
            const minutes = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
            const seconds = (remainingSeconds % 60).toString().padStart(2, '0');

            accusationCountdown.textContent = minutes + ':' + seconds;
            
            if (remainingMs === 0) {
                console.log("[Timer Debug] Temps écoulé. Tentative de résolution par l'hôte ?", canResolve);
                if (canResolve) {
                    resolveAccusation(accusation.id);
                }
            }
        }

        async function resolveAccusation(accusationId) {
            if (!currentLobbyId || !currentPlayer || accusationResolutionInProgress) {
                return;
            }

            accusationResolutionInProgress = true;
            try {
                const resolvedAccusation = await runTransaction(db, async function(transaction) {
                    const lobbyReference = doc(db, gamesCollectionName, currentLobbyId);
                    const lobbySnapshot = await transaction.get(lobbyReference);
                    const lobby = lobbySnapshot.data();
                    const accusation = lobby && lobby.activeAccusation;

                    if (!lobby || lobby.hostId !== currentPlayer.id || !accusation || accusation.id !== accusationId || Date.now() < Number(accusation.endsAt)) {
                        return null;
                    }

                    const players = Array.isArray(lobby.players) ? lobby.players : [];
                    const eliminatedPlayerIds = Array.isArray(lobby.eliminatedPlayerIds) ? lobby.eliminatedPlayerIds : [];
                    const livingPlayers = players.filter(function(player) {
                        return isPlayerAlive(player, eliminatedPlayerIds);
                    });
                    const votes = accusation.votes && typeof accusation.votes === 'object' ? accusation.votes : {};
                    const yesVotes = players.filter(function(player) { return votes[player.id] === true; }).length;
                    const majority = Math.floor(livingPlayers.length / 2) + 1;
                    const target = players.find(function(player) { return player.id === accusation.targetId; });
                    const passed = yesVotes >= majority && target && isPlayerAlive(target, eliminatedPlayerIds);
                    const accusationTotals = lobby.accusationTotals && typeof lobby.accusationTotals === 'object'
                        ? Object.assign({}, lobby.accusationTotals)
                        : {};

                    if (passed) {
                        accusationTotals[accusation.targetId] = (Number(accusationTotals[accusation.targetId]) || 0) + yesVotes;
                    }
                    const updates = {
                        activeAccusation: null,
                        pausedDayTimeMs: null,
                        lastAccusationResult: {
                            id: accusation.id,
                            accuserId: accusation.accuserId,
                            targetId: accusation.targetId,
                            yesVotes: yesVotes,
                            majority: majority,
                            passed: passed
                        },
                        gamePhase: 'day',
                        dayEndVotes: Array.isArray(lobby.dayEndVotes) ? lobby.dayEndVotes : [],
                        dayEndsAt: Date.now() + Math.max(0, Number(lobby.pausedDayTimeMs) || 0)
                    };

                    if (passed) {
                        updates.accusationTotals = accusationTotals;
                    }

                    transaction.update(lobbyReference, updates);
                    const accuser = players.find(function(player) { return player.id === accusation.accuserId; });
                    return {
                        accuserName: accuser ? accuser.pseudo : 'Un joueur',
                        targetName: target ? target.pseudo : 'un joueur',
                        voters: players.filter(function(player) { return votes[player.id] === true; })
                            .map(function(player) { return player.pseudo; })
                    };
                });

                if (resolvedAccusation) {
                    const voters = resolvedAccusation.voters.length > 0
                        ? resolvedAccusation.voters.join(', ')
                        : 'aucun joueur';
                    await journalSpeakToAll(
                        'Accusation initiée par ' + resolvedAccusation.accuserName
                        + ' contre ' + resolvedAccusation.targetName
                        + '. Joueurs ayant voté pour l’élimination : ' + voters + '.'
                    );
                }
            } catch (error) {
                accusationStatus.textContent = 'Impossible de terminer le vote. Vérifiez les règles Firestore.';
                console.error(error);
            } finally {
                accusationResolutionInProgress = false;
            }
        }

        function stopDayTimer() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }

            currentDayDeadline = null;
        }

        function startDayTimer(deadline) {
            if (!Number.isFinite(deadline) || deadline <= 0) {
                stopDayTimer();
                gameTimerValue.textContent = '--:--';
                return;
            }

            if (currentDayDeadline === deadline && countdownInterval) {
                updateDayTimer(deadline);
                return;
            }

            stopDayTimer();
            currentDayDeadline = deadline;
            updateDayTimer(deadline);
            countdownInterval = setInterval(function() {
                updateDayTimer(deadline);
            }, 1000);
        }

        function updateDayTimer(deadline) {
            const remainingMs = Math.max(0, deadline - Date.now());
            const remainingSeconds = Math.ceil(remainingMs / 1000);
            const minutes = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
            const seconds = (remainingSeconds % 60).toString().padStart(2, '0');

            gameTimerValue.textContent = minutes + ':' + seconds;
            if (remainingMs === 0) {
                advanceToNight();
            }
        }

        async function advanceToNight() {
            if (!currentLobbyId || !currentPlayer || dayTransitionInProgress) {
                return;
            }

            dayTransitionInProgress = true;
            try {
                await runTransaction(db, async function(transaction) {
                    const lobbyReference = doc(db, gamesCollectionName, currentLobbyId);
                    const lobbySnapshot = await transaction.get(lobbyReference);
                    const lobby = lobbySnapshot.data();

                    if (!lobby || lobby.hostId !== currentPlayer.id || lobby.gameIsRunning !== true || (lobby.gamePhase || 'day') !== 'day' || lobby.activeAccusation) {
                        return;
                    }

                    const deadline = Number(lobby.dayEndsAt);
                    const players = Array.isArray(lobby.players) ? lobby.players : [];
                    const eliminatedPlayerIds = Array.isArray(lobby.eliminatedPlayerIds) ? lobby.eliminatedPlayerIds : [];
                    const livingPlayers = players.filter(function(player) { return isPlayerAlive(player, eliminatedPlayerIds); });
                    const livingPlayerIds = livingPlayers.map(function(player) { return player.id; });
                    const dayEndVotes = Array.isArray(lobby.dayEndVotes) ? lobby.dayEndVotes : [];
                    const validDayEndVotes = dayEndVotes.filter(function(voterId) { return livingPlayerIds.includes(voterId); });
                    const dayEndMajority = validDayEndVotes.length >= Math.floor(livingPlayers.length / 2) + 1;

                    if ((!Number.isFinite(deadline) || Date.now() < deadline) && !dayEndMajority) {
                        return;
                    }

                    await finishDayInTransaction(transaction, lobbyReference, lobby);
                });
            } catch (error) {
                console.error(error);
            } finally {
                dayTransitionInProgress = false;
            }
        }

        async function castDayEndVote() {
            if (!currentLobbyId || !currentPlayer) {
                return;
            }

            try {
                await runTransaction(db, async function(transaction) {
                    const lobbyReference = doc(db, gamesCollectionName, currentLobbyId);
                    const lobbySnapshot = await transaction.get(lobbyReference);
                    const lobby = lobbySnapshot.data();

                    if (!lobby || lobby.gameIsRunning !== true || (lobby.gamePhase || 'day') !== 'day' || lobby.activeAccusation) {
                        return;
                    }

                    const players = Array.isArray(lobby.players) ? lobby.players : [];
                    const eliminatedPlayerIds = Array.isArray(lobby.eliminatedPlayerIds) ? lobby.eliminatedPlayerIds : [];
                    const livingPlayers = players.filter(function(player) {
                        return isPlayerAlive(player, eliminatedPlayerIds);
                    });
                    if (!livingPlayers.some(function(player) { return player.id === currentPlayer.id; })) {
                        return;
                    }

                    const livingPlayerIds = livingPlayers.map(function(player) { return player.id; });
                    const votes = Array.isArray(lobby.dayEndVotes) ? lobby.dayEndVotes.filter(function(voterId) {
                        return livingPlayerIds.includes(voterId);
                    }) : [];
                    const updatedVotes = votes.includes(currentPlayer.id)
                        ? votes.filter(function(voterId) { return voterId !== currentPlayer.id; })
                        : votes.concat(currentPlayer.id);
                    transaction.update(lobbyReference, { dayEndVotes: updatedVotes });
                });
            } catch (error) {
                gameMessage.textContent = 'Impossible d’enregistrer votre vote.';
                console.error(error);
            }
        }

        function subscribeToSystemMessages(lobbyId) {
            if (stopSystemMessagesListener) {
                stopSystemMessagesListener();
            }

            systemFeed.innerHTML = '';
            if (!currentPlayer) {
                return;
            }

            const messagesQuery = query(
                collection(db, gamesCollectionName, lobbyId, 'players', currentPlayer.id, 'systemMessages'),
                orderBy('createdAt')
            );
            stopSystemMessagesListener = onSnapshot(messagesQuery, function(snapshot) {
                systemFeed.innerHTML = '';
                if (snapshot.empty) {
                    const emptyMessage = document.createElement('li');
                    emptyMessage.className = 'system-empty';
                    emptyMessage.textContent = 'Aucune information du système pour le moment.';
                    systemFeed.appendChild(emptyMessage);
                    return;
                }

                snapshot.forEach(function(messageSnapshot) {
                    const messageData = messageSnapshot.data();
                    const messageItem = document.createElement('li');
                    if (messageData.createdAt && typeof messageData.createdAt.toDate === 'function') {
                        const messageTime = document.createElement('time');
                        messageTime.dateTime = messageData.createdAt.toDate().toISOString();
                        messageTime.textContent = new Intl.DateTimeFormat('fr-FR', {
                            hour: '2-digit',
                            minute: '2-digit'
                        }).format(messageData.createdAt.toDate());
                        messageItem.appendChild(messageTime);
                    }
                    messageItem.appendChild(document.createTextNode(messageData.message || ''));
                    systemFeed.appendChild(messageItem);
                });
            }, function(error) {
                console.error(error);
            });
        }

        async function sendSystemMessage(playerIds, messageText) {
            const normalizedMessage = typeof messageText === 'string' ? messageText.trim() : '';
            if (!currentLobbyId || !currentPlayer || !normalizedMessage) {
                return false;
            }

            try {
                const lobbySnapshot = await getDoc(doc(db, gamesCollectionName, currentLobbyId));
                const lobby = lobbySnapshot.data();
                if (!lobby || lobby.gameIsRunning !== true || currentPlayer.id !== lobby.hostId) {
                    return false;
                }

                const lobbyPlayers = Array.isArray(lobby.players) ? lobby.players : [];
                const requestedIds = playerIds === null
                    ? lobbyPlayers.map(function(player) { return player.id; })
                    : playerIds;
                const recipientIds = Array.from(new Set(requestedIds)).filter(function(id) {
                    return lobbyPlayers.some(function(player) { return player.id === id; });
                });
                if (recipientIds.length === 0) {
                    return false;
                }

                const batch = writeBatch(db);
                recipientIds.forEach(function(id) {
                    const messages = collection(db, gamesCollectionName, currentLobbyId, 'players', id, 'systemMessages');
                    batch.set(doc(messages), {
                        message: normalizedMessage,
                        createdAt: serverTimestamp()
                    });
                });
                await batch.commit();
                return true;
            } catch (error) {
                console.error(error);
                return false;
            }
        }

        async function journalSpeakToAll(messageText) {
            return sendSystemMessage(null, messageText);
        }

        async function journalSpeakToThisPlayer(player, messageText) {
            const playerId = player && typeof player === 'object' ? player.id : null;
            return sendSystemMessage(playerId ? [playerId] : [], messageText);
        }

        window.journalSpeakToAll = journalSpeakToAll;
        window.journalSpeakToThisPlayer = journalSpeakToThisPlayer;

        async function updateSelectedRole(roleName, isSelected) {
            if (!currentLobbyId || !currentPlayer) {
                return;
            }

            try {
                await runTransaction(db, async function(transaction) {
                    const lobbyReference = doc(db, gamesCollectionName, currentLobbyId);
                    const lobbySnapshot = await transaction.get(lobbyReference);
                    const lobby = lobbySnapshot.data();

                    if (!lobby || lobby.hostId !== currentPlayer.id || lobby.gameIsRunning) {
                        throw new Error('CONFIGURATION_INTERDITE');
                    }

                    const selectedRoles = Array.isArray(lobby.selectedRoles) ? lobby.selectedRoles : getAllRoleNames();
                    const updatedRoles = isSelected
                        ? Array.from(new Set(selectedRoles.concat(roleName)))
                        : selectedRoles.filter(function(selectedRole) {
                            return selectedRole !== roleName;
                        });

                    transaction.update(lobbyReference, {
                        selectedRoles: updatedRoles
                    });
                });
            } catch (error) {
                showMessage('Seul l’hôte peut modifier les rôles avant le lancement.');
                try {
                    const lobbySnapshot = await getDoc(doc(db, gamesCollectionName, currentLobbyId));
                    if (lobbySnapshot.exists()) {
                        renderRolePanel(lobbySnapshot.data());
                    }
                } catch (refreshError) {
                    console.error(refreshError);
                }
                console.error(error);
            }
        }

        async function updateRoleCount(categoryKey, value) {
            const count = Number(value);

            if (!Number.isInteger(count) || count < 0 || count > 20) {
                const lobbySnapshot = await getDoc(doc(db, gamesCollectionName, currentLobbyId));
                if (lobbySnapshot.exists()) {
                    renderRoleCounts(lobbySnapshot.data());
                }
                return;
            }

            try {
                await runTransaction(db, async function(transaction) {
                    const lobbyReference = doc(db, gamesCollectionName, currentLobbyId);
                    const lobbySnapshot = await transaction.get(lobbyReference);
                    const lobby = lobbySnapshot.data();

                    if (!lobby || lobby.hostId !== currentPlayer.id || lobby.gameIsRunning) {
                        throw new Error('CONFIGURATION_INTERDITE');
                    }

                    transaction.update(lobbyReference, {
                        ['roleCounts.' + categoryKey]: count
                    });
                });
            } catch (error) {
                showMessage('Seul l’hôte peut modifier le nombre de rôles avant le lancement.');
                console.error(error);
                const lobbySnapshot = await getDoc(doc(db, gamesCollectionName, currentLobbyId));
                if (lobbySnapshot.exists()) {
                    renderRoleCounts(lobbySnapshot.data());
                }
            }
        }

        function validateGameConfiguration(lobby) {
            const selectedRoles = Array.isArray(lobby.selectedRoles) ? lobby.selectedRoles : [];
            const roleCounts = lobby.roleCounts || roleCountDefaults;
            const playersCount = (lobby.players || []).length;
            const townsfolkCount = Number(roleCounts.townsfolk) || 0;
            const outsiderCount = Number(roleCounts.outsider) || 0;
            const minionCount = Number(roleCounts.minion) || 0;
            const expectedPlayersCount = townsfolkCount + outsiderCount + minionCount + 1;
            const validationErrors = [];
            const selectedTownsfolkCount = roleCatalog.townsfolk.roles.filter(function(roleName) {
                return selectedRoles.includes(roleName);
            }).length;
            const selectedOutsiderCount = roleCatalog.outsider.roles.filter(function(roleName) {
                return selectedRoles.includes(roleName);
            }).length;

            if (playersCount !== expectedPlayersCount) {
                validationErrors.push('Joueurs connectés : ' + playersCount + ', alors que ' + expectedPlayersCount + ' sont requis.');
            }

            if (!selectedRoles.includes('Diable')) {
                validationErrors.push('Le rôle Diable doit être coché.');
            }

            if (selectedTownsfolkCount < townsfolkCount + 3) {// Pour que le Diable puisse être choisi, il faut au moins 3 Villageois de plus que le nombre de Villageois requis.
                validationErrors.push('il faut au moins ' + (townsfolkCount + 3) + ' Villageois coché(s).');
            }

            const categoryRules = [
                ['townsfolk', 'Villageois'],
                ['outsider', 'Paria'],
                ['minion', 'Sbire']
            ];
            categoryRules.forEach(function(rule) {
                const categoryKey = rule[0];
                const categoryLabel = rule[1];
                const selectedCount = roleCatalog[categoryKey].roles.filter(function(roleName) {
                    return selectedRoles.includes(roleName);
                }).length;
                const requiredCount = Number(roleCounts[categoryKey]) || 0;

                if (selectedCount < requiredCount) {
                    validationErrors.push(categoryLabel + ' : ' + selectedCount + ' rôle(s) coché(s) pour ' + requiredCount + ' requis.');
                }
            });

            if (selectedRoles.includes('Baron') && townsfolkCount < 2) {//Si le Baron est choisi, il faut pouvoir transformer 2 Villageois en Paria.
                validationErrors.push('Baron sélectionné : il faut au moins 2 Villageois.');
            }

            if (selectedRoles.includes('Baron') && selectedOutsiderCount < outsiderCount + 2) {//Si le Baron est choisi, il faut au moins 2 Paria disponible de plus que le nombre de Paria obligatoirement présent.
                validationErrors.push('Baron sélectionné : il faut au moins ' + (outsiderCount + 2) + ' Paria coché(s).');
            }

            if (selectedRoles.includes('Ivrogne') && selectedTownsfolkCount < townsfolkCount + 4) {//Si l'Ivrogne est choisi, il doit croire qu'il est un Villageois autre que les 3 Villageois montré au Diable
                validationErrors.push('Ivrogne sélectionné : il faut au moins ' + (townsfolkCount + 4) + ' Villageois coché(s).');
            }

            if ((selectedRoles.includes('Lavandiere') || selectedRoles.includes('Vierge')) && townsfolkCount < 2) {///Ces deux roles sont des Villageois qui ont besoin de la présence d'au moins un autre Villageois pour être jouable.
                validationErrors.push('Lavandiere ou Vierge sélectionnée : il faut au moins 2 Villageois.');
            }

            if (selectedRoles.includes('Libraire') && outsiderCount < 1) {//Le Libraire est un Villageois qui a besoin de la présence d'au moins un Paria pour être jouable.
                validationErrors.push('Libraire sélectionné : il faut au moins 1 Paria.');
            }

            if ((selectedRoles.includes('Enqueteur') || selectedRoles.includes('Chef')) && minionCount < 1) {//Ces deux roles sont des Villageois qui ont besoin de la présence d'au moins un Sbire pour être jouable.
                validationErrors.push('Enqueteur ou Chef sélectionné : il faut au moins 1 Sbire.');
            }

            if((townsfolkCount + outsiderCount) <= (minionCount + 1)) {//S'il y a trop de Sbires par rapport au nombre de Villageois et Paria, la partie est impossible a gagner pour le village.
                validationErrors.push('Le nombre de Villageois et Paria doit être supérieur au nombre de Sbires + 1.');
            }

            return validationErrors;
        }

        function subscribeToLobby(lobbyId) {
            if (stopLobbyListener) {
                stopLobbyListener();
            }

            currentLobbyId = lobbyId;
            sessionStorage.setItem('botc-lobby-id', lobbyId);
            stopLobbyListener = onSnapshot(doc(db, gamesCollectionName, lobbyId), function(snapshot) {
                if (!snapshot.exists()) {
                    leaveLobbyView();
                    showMessage('Cette partie n’est plus disponible.');
                    return;
                }

                renderLobby(snapshot.data());
            }, function() {
                showMessage('Impossible de suivre les changements du lobby.');
            });
        }

        function enterLobby(lobbyId, player) {
            currentPlayer = player;
            homeView.classList.add('hidden');
            lobbyView.classList.remove('hidden');
            gameView.classList.add('hidden');
            showMessage('');
            subscribeToLobby(lobbyId);
            subscribeToSystemMessages(lobbyId);
        }

        function leaveLobbyView() {
            if (stopLobbyListener) {
                stopLobbyListener();
                stopLobbyListener = null;
            }

            if (stopSystemMessagesListener) {
                stopSystemMessagesListener();
                stopSystemMessagesListener = null;
            }

            stopDayTimer();
            stopAccusationTimer();

            currentLobbyId = '';
            currentPlayer = null;
            sessionStorage.removeItem('botc-lobby-id');
            lobbyView.classList.add('hidden');
            gameView.classList.add('hidden');
            homeView.classList.remove('hidden');
        }

        async function ensureSignedIn() {
            if (!auth.currentUser) {
                await signInAnonymously(auth);
            }
        }

        function createPlayerData(pseudo) {
            return {
                pseudo: pseudo,
                isAlive: true,
                role: '',
                secondaryRole: '',
                lastVote: false,
                canAccuse: true,
                createdAt: serverTimestamp()
            };
        }

        function getPlayerReference(lobbyId) {
            return doc(db, gamesCollectionName, lobbyId, 'players', playerId);
        }

        async function cleanOldGames() {
            const expirationDate = new Date(Date.now() - 6 * 60 * 60 * 1000);
            const oldGamesQuery = query(
                collection(db, gamesCollectionName),
                where('createdAt', '<', expirationDate)
            );
            const oldGamesSnapshot = await getDocs(oldGamesQuery);

            for (const gameDocument of oldGamesSnapshot.docs) {
                const playersSnapshot = await getDocs(
                    collection(db, gamesCollectionName, gameDocument.id, 'players')
                );

                if (playersSnapshot.empty) {
                    await deleteDoc(gameDocument.ref);
                    continue;
                }

                for (let index = 0; index < playersSnapshot.docs.length; index += 450) {
                    const batch = writeBatch(db);
                    const playerDocuments = playersSnapshot.docs.slice(index, index + 450);

                    playerDocuments.forEach(function(playerDocument) {
                        batch.delete(playerDocument.ref);
                    });

                    if (index + 450 >= playersSnapshot.docs.length) {
                        batch.delete(gameDocument.ref);
                    }

                    await batch.commit();
                }
            }
        }

        document.getElementById('create-game').addEventListener('click', async function(e) {
            e.preventDefault();
            const pseudo = pseudoInput.value.trim();
            let password = passwordInput.value.trim();

            if (!pseudo) {
                showMessage('Veuillez entrer votre pseudo avant de créer une partie.');
                pseudoInput.focus();
                return;
            }

            if (!password) {
                password = Math.random().toString(36).slice(2, 8).toUpperCase();
                passwordInput.value = password;
            }

            try {
                await ensureSignedIn();
                await cleanOldGames();
                const player = { id: playerId, pseudo: pseudo };
                const lobbyReference = doc(collection(db, gamesCollectionName));
                await runTransaction(db, async function(transaction) {
                    transaction.set(lobbyReference, {
                        password: password,
                        hostId: playerId,
                        players: [player],
                        createdAt: serverTimestamp(),
                        gameIsRunning: false,
                        roleCounts: roleCountDefaults,
                        selectedRoles: getAllRoleNames()
                    });
                    transaction.set(getPlayerReference(lobbyReference.id), createPlayerData(pseudo));
                });
                enterLobby(lobbyReference.id, player);
            } catch (error) {
                showMessage('Impossible de créer la partie. Vérifiez la configuration Firebase.');
                console.error(error);
            }
        });

        joinForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const pseudo = pseudoInput.value.trim();
            const password = passwordInput.value.trim();

            if (!pseudo || !password) {
                showMessage('Veuillez entrer votre pseudo et le mot de passe de la partie.');
                return;
            }

            try {
                await ensureSignedIn();
                const lobbyQuery = query(
                    collection(db, gamesCollectionName),
                    where('password', '==', password),
                    limit(1)
                );
                const lobbySnapshot = await getDocs(lobbyQuery);

                if (lobbySnapshot.empty) {
                    showMessage('Aucune partie ne correspond à ce mot de passe.');
                    return;
                }

                const lobbyDocument = lobbySnapshot.docs[0];
                const player = { id: playerId, pseudo: pseudo };
                await runTransaction(db, async function(transaction) {
                    const lobbyReference = doc(db, gamesCollectionName, lobbyDocument.id);
                    const currentLobby = await transaction.get(lobbyReference);
                    const lobbyData = currentLobby.data();
                    const players = lobbyData.players || [];

                    if (lobbyData.gameIsRunning === true) {
                        throw new Error('PARTIE_DEJA_LANCEE');
                    }

                    if (players.some(function(existingPlayer) {
                        return existingPlayer.pseudo.toLowerCase() === pseudo.toLowerCase();
                    })) {
                        throw new Error('PSEUDO_DEJA_UTILISE');
                    }

                    transaction.update(lobbyReference, {
                        players: players.concat(player)
                    });
                    transaction.set(getPlayerReference(lobbyDocument.id), createPlayerData(pseudo));
                });
                enterLobby(lobbyDocument.id, player);
            } catch (error) {
                if (error.message === 'PSEUDO_DEJA_UTILISE') {
                    showMessage('Ce pseudo est déjà utilisé dans le lobby.');
                } else if (error.message === 'PARTIE_DEJA_LANCEE') {
                    showMessage('Cette partie a déjà été lancée.');
                } else {
                    showMessage('Impossible de rejoindre la partie. Vérifiez le mot de passe.');
                    console.error(error);
                }
            }
        });

        startGameButton.addEventListener('click', async function() {
            if (!currentLobbyId || !currentPlayer) {
                return;
            }

            try {
                await runTransaction(db, async function(transaction) {
                    const lobbyReference = doc(db, gamesCollectionName, currentLobbyId);
                    const lobbySnapshot = await transaction.get(lobbyReference);
                    const lobby = lobbySnapshot.data();

                    if (!lobby || lobby.hostId !== currentPlayer.id) {
                        throw new Error('HOTE_REQUIS');
                    }

                    if (lobby.gameIsRunning === true) {
                        return;
                    }

                    /* MODE TEST TEMPORAIRE : réactiver ces validations avant les vraies parties.
                    const validationErrors = validateGameConfiguration(lobby);
                    if (validationErrors.length > 0) {
                        const validationError = new Error('CONFIGURATION_INVALIDE');
                        validationError.validationErrors = validationErrors;
                        throw validationError;
                    }
                    */

                    transaction.update(lobbyReference, {
                        gameIsRunning: true,
                        gamePhase: 'day',
                        dayEndsAt: Date.now() + dayDurationMs,
                        dayEndVotes: [],
                        accusedPlayerIds: [],
                        eliminatedPlayerIds: []
                    });
                });
            } catch (error) {
                if (error.message === 'CONFIGURATION_INVALIDE') {
                    showMessage('Partie impossible à lancer : ' + error.validationErrors.join(' '));
                } else {
                    showMessage('Seul l’hôte peut lancer la partie.');
                }
                console.error(error);
            }
        });

        voteDayEndButton.addEventListener('click', castDayEndVote);
        startDayButton.addEventListener('click', startDay);
        accusationVoteSwitch.addEventListener('click', castAccusationVote);

        document.getElementById('leave-lobby').addEventListener('click', async function() {
            if (!currentLobbyId || !currentPlayer) {
                leaveLobbyView();
                return;
            }

            try {
                const lobbyReference = doc(db, gamesCollectionName, currentLobbyId);
                const lobbySnapshot = await getDoc(lobbyReference);
                const lobby = lobbySnapshot.exists() ? lobbySnapshot.data() : null;

                await deleteDoc(getPlayerReference(currentLobbyId));

                if (lobby && lobby.hostId === currentPlayer.id) {
                    await deleteDoc(lobbyReference);
                } else {
                    await updateDoc(lobbyReference, {
                        players: arrayRemove(currentPlayer)
                    });
                }
            } catch (error) {
                console.error(error);
            } finally {
                leaveLobbyView();
            }
        });

        ensureSignedIn().then(function() {
            const savedLobbyId = sessionStorage.getItem('botc-lobby-id');
            if (savedLobbyId) {
                const lobbyReference = doc(db, gamesCollectionName, savedLobbyId);
                getDoc(lobbyReference).then(function(snapshot) {
                    const lobby = snapshot.data();
                    const savedPlayer = lobby && (lobby.players || []).find(function(player) {
                        return player.id === playerId;
                    });

                    if (savedPlayer) {
                        enterLobby(savedLobbyId, savedPlayer);
                    }
                }).catch(function(error) {
                    console.error(error);
                });
            }
        }).catch(function(error) {
            showMessage('Connexion à Firebase impossible.');
            console.error(error);
        });
    </script>
