<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Clocktower en Ligne</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e94560;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #16213e;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .lobby-layout {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 1.5rem;
            width: min(900px, 100%);
        }
        .lobby-container {
            flex: 1 1 400px;
        }
        .roles-panel {
            flex: 0 1 330px;
            max-height: calc(100vh - 4rem);
            overflow-y: auto;
            text-align: left;
        }
        .roles-panel::-webkit-scrollbar {
            width: 8px;
        }
        .roles-panel::-webkit-scrollbar-thumb {
            background-color: #533483;
            border-radius: 4px;
        }
        .roles-panel h2 {
            margin-top: 0;
            color: #e94560;
            text-align: center;
        }
        .role-counts {
            margin-bottom: 1rem;
            padding: 0.75rem;
            background-color: rgba(15, 52, 96, 0.65);
        }
        .role-count {
            display: grid;
            grid-template-columns: 1fr 4.5rem;
            align-items: center;
            gap: 0.75rem;
            margin: 0.45rem 0;
            color: white;
            font-size: 0.9rem;
        }
        .role-count input {
            width: 4.5rem;
            padding: 0.45rem;
            text-align: center;
        }
        .role-category {
            margin-top: 1.25rem;
        }
        .role-category h3 {
            margin: 0 0 0.5rem;
            color: #86b8e8;
            font-size: 1rem;
        }
        .role-category.minion h3,
        .role-category.demon h3 {
            color: #e94560;
        }
        .role-option {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.35rem 0;
            color: white;
            font-size: 0.9rem;
        }
        .role-option input {
            width: auto;
            accent-color: #e94560;
        }
        .role-option input:not(:disabled) {
            cursor: pointer;
        }
        @media (max-width: 720px) {
            body {
                align-items: flex-start;
                height: auto;
                min-height: 100vh;
                padding: 1rem 0;
            }
            .lobby-layout {
                flex-direction: column;
                align-items: stretch;
                width: 100%;
            }
            .roles-panel {
                max-height: 420px;
            }
        }
        .hidden {
            display: none;
        }
        h1 {
            margin-bottom: 1.5rem;
            color: #e94560;
        }
        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 5px;
            background-color: #0f3460;
            color: white;
            box-sizing: border-box;
        }
        input:focus {
            outline: 2px solid #e94560;
        }
        button {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 5px;
            background-color: #e94560;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 1rem;
        }
        button:hover {
            background-color: #cf3a54;
        }
        .footer {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #533483;
        }
        .footer a {
            color: inherit;
            text-decoration: none;
        }
        .message {
            min-height: 1.2rem;
            margin: 1rem 0 0;
            color: #f5c542;
            font-size: 0.9rem;
        }
        .lobby-password {
            margin: 1rem 0;
            padding: 0.8rem;
            background-color: #0f3460;
            color: white;
            font-weight: bold;
            letter-spacing: 0.08rem;
        }
        .players {
            margin: 1.5rem 0;
            padding: 0;
            color: white;
            list-style: none;
        }
        .players li {
            padding: 0.45rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
        .game-layout {
            width: min(1500px, 100vw);
            height: 100vh;
            padding: 1rem;
            display: grid;
            grid-template-columns: minmax(220px, 1fr) minmax(360px, 1.6fr) minmax(220px, 1fr);
            grid-template-rows: auto minmax(0, 1fr) minmax(180px, 28vh);
            grid-template-areas:
                ". timer roles"
                ". players roles"
                ". system roles";
            gap: 1rem;
        }
        .game-layout.hidden {
            display: none;
        }
        .game-timer {
            grid-area: timer;
            align-self: center;
            text-align: center;
        }
        .game-phase {
            margin: 0 0 0.2rem;
            color: #86b8e8;
            font-weight: 700;
        }
        .game-timer output {
            color: #f5c542;
            font-size: 2.25rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .game-players,
        .game-roles,
        .system-chat {
            min-width: 0;
            background-color: #16213e;
            border-radius: 8px;
        }
        .game-players {
            grid-area: players;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }
        .game-section-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
        }
        .game-section-heading h1,
        .game-roles h2,
        .system-chat h2 {
            margin: 0;
            font-size: 1.2rem;
        }
        .game-section-heading p {
            margin: 0;
            color: #86b8e8;
            text-align: right;
        }
        .game-player-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            margin: 0.75rem 0 0;
            padding: 0;
            list-style: none;
            color: white;
        }
        .game-player-row {
            display: grid;
            grid-template-columns: 1.5rem minmax(0, 1fr) auto;
            align-items: center;
            gap: 0.6rem;
            min-height: 2.6rem;
            padding: 0.35rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
        .player-skull {
            color: #e94560;
            text-align: center;
        }
        .player-state {
            color: #86b8e8;
            font-size: 0.8rem;
        }
        .game-vote-button {
            flex: 0 0 auto;
            width: 100%;
            margin-top: 0.75rem;
        }
        .game-message {
            min-height: 1.2rem;
            margin: 0.4rem 0 0;
            color: #f5c542;
            font-size: 0.85rem;
            text-align: center;
        }
        .game-roles {
            grid-area: roles;
            min-height: 0;
            overflow-y: auto;
            padding: 1.25rem;
        }
        .game-roles h2 {
            text-align: center;
        }
        .game-role-category {
            margin-top: 1.2rem;
        }
        .game-role-category h3 {
            margin: 0 0 0.45rem;
            color: #86b8e8;
            font-size: 0.95rem;
        }
        .game-role-category.minion h3,
        .game-role-category.demon h3 {
            color: #e94560;
        }
        .game-role-category ul {
            margin: 0;
            padding-left: 1.2rem;
            color: white;
        }
        .game-role-category li {
            padding: 0.2rem 0;
        }
        .system-chat {
            grid-area: system;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 0.9rem 1rem;
        }
        .system-feed {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            margin: 0.55rem 0 0;
            padding: 0;
            list-style: none;
            color: white;
        }
        .system-feed li {
            padding: 0.45rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            overflow-wrap: anywhere;
        }
        .system-feed time {
            margin-right: 0.5rem;
            color: #86b8e8;
            font-size: 0.8rem;
        }
        .system-feed .system-empty {
            color: #b8c3d8;
            font-style: italic;
        }
        @media (max-width: 850px) {
            body {
                height: auto;
                min-height: 100vh;
            }
            .game-layout {
                width: 100%;
                flex: 0 0 100%;
                height: auto;
                min-height: 100vh;
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto minmax(260px, 1fr) minmax(190px, 30vh) auto;
                grid-template-areas:
                    "timer"
                    "players"
                    "system"
                    "roles";
            }
            .game-roles {
                max-height: 360px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="home-view">
        <h1>Blood on the Clocktower</h1>
        <form id="join-form">
            <div class="form-group">
                <label for="pseudo">Votre Pseudo</label>
                <input type="text" id="pseudo" name="pseudo" placeholder="Ex: Jean_Michel" required>
            </div>
            <div class="form-group">
                <label for="game-password">Mot de passe de la partie</label>
                <input type="password" id="game-password" name="game-password" placeholder="Mot de passe commun" required>
            </div>
            <button type="submit">Rejoindre la partie</button>
        </form>
        <p class="message" id="message" role="status"></p>
        <div class="footer">
            <a href="#" id="create-game">Créer une partie</a>
        </div>
    </div>

    <div class="lobby-layout hidden" id="lobby-view">
        <div class="container lobby-container">
            <h1>Lobby</h1>
            <p>Mot de passe de la partie :</p>
            <div class="lobby-password" id="lobby-password"></div>
            <h2>Joueurs connectés</h2>
            <ul class="players" id="players-list"></ul>
            <button type="button" id="start-game">Lancer la partie</button>
            <button type="button" id="leave-lobby">Quitter le lobby</button>
            <p class="message" id="lobby-message" role="status"></p>
        </div>
        <aside class="container roles-panel" aria-labelledby="roles-title">
            <h2 id="roles-title">Configuration des rôles</h2>
            <div class="role-counts" id="role-counts"></div>
            <div id="roles-list"></div>
        </aside>
    </div>

    <main class="game-layout hidden" id="game-view" aria-label="Partie en cours">
        <header class="game-timer">
            <p class="game-phase" id="game-phase-label">Jour en cours</p>
            <output id="game-timer-value" aria-live="polite">05:00</output>
        </header>
        <section class="game-players" aria-labelledby="game-players-title">
            <div class="game-section-heading">
                <h1 id="game-players-title">Joueurs</h1>
                <p id="day-vote-count"></p>
            </div>
            <ul class="game-player-list" id="game-players-list"></ul>
            <button class="game-vote-button" type="button" id="vote-day-end">Voter pour la fin de journée</button>
            <p class="game-message" id="game-message" role="status"></p>
        </section>
        <aside class="game-roles" aria-labelledby="game-roles-title">
            <h2 id="game-roles-title">Rôles possibles</h2>
            <div id="game-roles-list"></div>
        </aside>
        <section class="system-chat" aria-labelledby="system-chat-title">
            <h2 id="system-chat-title">Journal du système</h2>
            <ol class="system-feed" id="system-feed" aria-live="polite"></ol>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
        import {
            arrayRemove,
            collection,
            deleteDoc,
            doc,
            getDoc,
            getDocs,
            getFirestore,
            limit,
            onSnapshot,
            orderBy,
            query,
            runTransaction,
            serverTimestamp,
            updateDoc,
            where,
            writeBatch
        } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyARy2cLQeecGdapyUsp0C3fgeUWXi5Thg4',
            authDomain: 'botc-database-gamemaster.firebaseapp.com',
            projectId: 'botc-database-gamemaster',
            storageBucket: 'botc-database-gamemaster.firebasestorage.app',
            messagingSenderId: '1089060485131',
            appId: '1:1089060485131:web:21c8fa56a336901ddc6f0e'
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const homeView = document.getElementById('home-view');
        const lobbyView = document.getElementById('lobby-view');
        const gameView = document.getElementById('game-view');
        const joinForm = document.getElementById('join-form');
        const pseudoInput = document.getElementById('pseudo');
        const passwordInput = document.getElementById('game-password');
        const message = document.getElementById('message');
        const lobbyMessage = document.getElementById('lobby-message');
        const lobbyPassword = document.getElementById('lobby-password');
        const playersList = document.getElementById('players-list');
        const startGameButton = document.getElementById('start-game');
        const roleCounts = document.getElementById('role-counts');
        const rolesList = document.getElementById('roles-list');
        const gamePhaseLabel = document.getElementById('game-phase-label');
        const gameTimerValue = document.getElementById('game-timer-value');
        const gamePlayersList = document.getElementById('game-players-list');
        const gameRolesList = document.getElementById('game-roles-list');
        const dayVoteCount = document.getElementById('day-vote-count');
        const voteDayEndButton = document.getElementById('vote-day-end');
        const gameMessage = document.getElementById('game-message');
        const systemFeed = document.getElementById('system-feed');
        const gamesCollectionName = 'games';
        const dayDurationMs = 15 * 60 * 1000;//15 minutes
        const roleCountDefaults = {
            townsfolk: 3,
            outsider: 2,
            minion: 2
        };
        const roleCatalog = {
            townsfolk: {
                label: 'Villageois (Townsfolk)',
                roles: ['Lavandiere', 'Libraire', 'Enqueteur', 'Chef', 'Empatique', 'Voyante', 'Croque-mort', 'Moine', 'Gardien', 'Mercenaire', 'Vierge', 'Soldat', 'Maire']
            },
            outsider: {
                label: 'Paria (Outsider)',
                roles: ['Majordome', 'Ivrogne', 'Recluse', 'Saint']
            },
            minion: {
                label: 'Sbire (Minion)',
                roles: ['Empoisonneur', 'Espion', 'Femme fatale', 'Baron']
            },
            demon: {
                label: 'Démon (Demon)',
                roles: ['Diable']
            }
        };
        const playerId = sessionStorage.getItem('botc-player-id') || crypto.randomUUID();
        let currentPlayer = null;
        let currentLobbyId = '';
        let stopLobbyListener = null;
        let stopSystemMessagesListener = null;
        let countdownInterval = null;
        let currentDayDeadline = null;
        let dayTransitionInProgress = false;

        sessionStorage.setItem('botc-player-id', playerId);

        function showMessage(text) {
            message.textContent = text;
            lobbyMessage.textContent = text;
        }

        function getAllRoleNames() {
            return Object.values(roleCatalog).flatMap(function(category) {
                return category.roles;
            });
        }

        function renderRoleCounts(lobby) {
            const counts = lobby.roleCounts || roleCountDefaults;
            const canEditCounts = Boolean(currentPlayer && currentPlayer.id === lobby.hostId && !lobby.gameIsRunning);
            roleCounts.innerHTML = '';

            Object.entries(roleCountDefaults).forEach(function(entry) {
                const categoryKey = entry[0];
                const categoryLabel = roleCatalog[categoryKey].label.split(' (')[0];
                const countLabel = document.createElement('label');
                const countInput = document.createElement('input');

                countLabel.className = 'role-count';
                countLabel.textContent = categoryLabel;
                countInput.type = 'number';
                countInput.min = '0';
                countInput.max = '20';
                countInput.step = '1';
                countInput.inputMode = 'numeric';
                countInput.value = Number.isInteger(counts[categoryKey]) ? counts[categoryKey] : roleCountDefaults[categoryKey];
                countInput.disabled = !canEditCounts;
                countInput.addEventListener('change', function() {
                    updateRoleCount(categoryKey, countInput.value);
                });
                countLabel.appendChild(countInput);
                roleCounts.appendChild(countLabel);
            });
        }

        function renderRolePanel(lobby) {
            const selectedRoles = lobby.selectedRoles || getAllRoleNames();
            const canEditRoles = Boolean(currentPlayer && currentPlayer.id === lobby.hostId && !lobby.gameIsRunning);
            rolesList.innerHTML = '';

            Object.entries(roleCatalog).forEach(function(entry) {
                const categoryKey = entry[0];
                const category = entry[1];
                const categoryElement = document.createElement('section');
                categoryElement.className = 'role-category ' + categoryKey;

                const categoryTitle = document.createElement('h3');
                categoryTitle.textContent = category.label;
                categoryElement.appendChild(categoryTitle);

                category.roles.forEach(function(roleName) {
                    const roleLabel = document.createElement('label');
                    const roleCheckbox = document.createElement('input');
                    const roleText = document.createElement('span');

                    roleLabel.className = 'role-option';
                    roleCheckbox.type = 'checkbox';
                    roleCheckbox.checked = selectedRoles.includes(roleName);
                    roleCheckbox.disabled = !canEditRoles;
                    roleText.textContent = roleName;
                    roleCheckbox.addEventListener('change', function() {
                        updateSelectedRole(roleName, roleCheckbox.checked);
                    });
                    roleLabel.appendChild(roleCheckbox);
                    roleLabel.appendChild(roleText);
                    categoryElement.appendChild(roleLabel);
                });

                rolesList.appendChild(categoryElement);
            });
        }

        function renderLobby(lobby) {
            const gameIsRunning = lobby.gameIsRunning === true;

            lobbyView.classList.toggle('hidden', gameIsRunning);
            gameView.classList.toggle('hidden', !gameIsRunning);
            lobbyPassword.textContent = lobby.password;
            playersList.innerHTML = '';
            startGameButton.classList.toggle('hidden', Boolean(lobby.gameIsRunning) || !currentPlayer || currentPlayer.id !== lobby.hostId);
            renderRoleCounts(lobby);
            renderRolePanel(lobby);

            (lobby.players || []).forEach(function(player) {
                const playerItem = document.createElement('li');
                playerItem.textContent = player.pseudo;
                playersList.appendChild(playerItem);
            });

            if (gameIsRunning) {
                renderGame(lobby);
            } else {
                stopDayTimer();
            }
        }

        function renderGame(lobby) {
            const selectedRoles = Array.isArray(lobby.selectedRoles) ? lobby.selectedRoles : [];
            const phase = lobby.gamePhase || 'day';

            gamePhaseLabel.textContent = phase === 'night' ? 'La nuit est tombée' : 'Jour en cours';
            renderGameRoles(selectedRoles);
            renderGamePlayers(lobby, phase);

            if (phase === 'day') {
                const deadline = lobby.dayEndsAt && typeof lobby.dayEndsAt.toMillis === 'function'
                    ? lobby.dayEndsAt.toMillis()
                    : Number(lobby.dayEndsAt);
                startDayTimer(deadline);
            } else {
                stopDayTimer();
                gameTimerValue.textContent = 'Nuit';
            }
        }

        function renderGameRoles(selectedRoles) {
            gameRolesList.innerHTML = '';

            Object.entries(roleCatalog).forEach(function(entry) {
                const categoryKey = entry[0];
                const category = entry[1];
                const categoryRoles = category.roles.filter(function(roleName) {
                    return selectedRoles.includes(roleName);
                });

                if (categoryRoles.length === 0) {
                    return;
                }

                const categoryElement = document.createElement('section');
                const categoryTitle = document.createElement('h3');
                const categoryList = document.createElement('ul');
                categoryElement.className = 'game-role-category ' + categoryKey;
                categoryTitle.textContent = category.label;
                categoryElement.appendChild(categoryTitle);

                categoryRoles.forEach(function(roleName) {
                    const roleItem = document.createElement('li');
                    roleItem.textContent = roleName;
                    categoryList.appendChild(roleItem);
                });

                categoryElement.appendChild(categoryList);
                gameRolesList.appendChild(categoryElement);
            });
        }

        function renderGamePlayers(lobby, phase) {
            const players = Array.isArray(lobby.players) ? lobby.players : [];
            const eliminatedPlayerIds = Array.isArray(lobby.eliminatedPlayerIds) ? lobby.eliminatedPlayerIds : [];
            const dayEndVotes = Array.isArray(lobby.dayEndVotes) ? lobby.dayEndVotes : [];
            const livingPlayers = players.filter(function(player) {
                return !eliminatedPlayerIds.includes(player.id);
            });
            const livingPlayerIds = livingPlayers.map(function(player) {
                return player.id;
            });
            const validVotes = dayEndVotes.filter(function(voterId) {
                return livingPlayerIds.includes(voterId);
            });
            const majority = Math.floor(livingPlayers.length / 2) + 1;
            const hasVoted = currentPlayer && validVotes.includes(currentPlayer.id);
            const isEliminated = currentPlayer && eliminatedPlayerIds.includes(currentPlayer.id);

            gamePlayersList.innerHTML = '';
            players.forEach(function(player) {
                const playerItem = document.createElement('li');
                const skullSlot = document.createElement('span');
                const playerName = document.createElement('span');
                const playerState = document.createElement('span');
                const eliminated = eliminatedPlayerIds.includes(player.id);

                playerItem.className = 'game-player-row';
                skullSlot.className = 'player-skull';
                skullSlot.textContent = eliminated ? '☠' : '';
                skullSlot.setAttribute('aria-label', eliminated ? 'Éliminé' : '');
                playerName.textContent = player.pseudo;
                playerState.className = 'player-state';
                playerState.textContent = validVotes.includes(player.id) ? 'A voté' : '';
                playerItem.appendChild(skullSlot);
                playerItem.appendChild(playerName);
                playerItem.appendChild(playerState);
                gamePlayersList.appendChild(playerItem);
            });

            dayVoteCount.textContent = validVotes.length + ' / ' + livingPlayers.length + ' votes; majorité : ' + majority;
            voteDayEndButton.disabled = phase !== 'day' || !currentPlayer || isEliminated;
            voteDayEndButton.textContent = phase !== 'day'
                ? 'La nuit est tombée'
                : hasVoted
                    ? 'Retirer mon vote'
                    : 'Voter pour la fin de journée';
            gameMessage.textContent = '';
        }

        function stopDayTimer() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }

            currentDayDeadline = null;
        }

        function startDayTimer(deadline) {
            if (!Number.isFinite(deadline) || deadline <= 0) {
                stopDayTimer();
                gameTimerValue.textContent = '--:--';
                return;
            }

            if (currentDayDeadline === deadline && countdownInterval) {
                updateDayTimer(deadline);
                return;
            }

            stopDayTimer();
            currentDayDeadline = deadline;
            updateDayTimer(deadline);
            countdownInterval = setInterval(function() {
                updateDayTimer(deadline);
            }, 1000);
        }

        function updateDayTimer(deadline) {
            const remainingMs = Math.max(0, deadline - Date.now());
            const remainingSeconds = Math.ceil(remainingMs / 1000);
            const minutes = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
            const seconds = (remainingSeconds % 60).toString().padStart(2, '0');

            gameTimerValue.textContent = minutes + ':' + seconds;
            if (remainingMs === 0) {
                advanceToNight();
            }
        }

        async function advanceToNight() {
            if (!currentLobbyId || dayTransitionInProgress) {
                return;
            }

            dayTransitionInProgress = true;
            try {
                await runTransaction(db, async function(transaction) {
                    const lobbyReference = doc(db, gamesCollectionName, currentLobbyId);
                    const lobbySnapshot = await transaction.get(lobbyReference);
                    const lobby = lobbySnapshot.data();

                    if (!lobby || lobby.gameIsRunning !== true || (lobby.gamePhase || 'day') !== 'day') {
                        return;
                    }

                    const deadline = Number(lobby.dayEndsAt);
                    if (!Number.isFinite(deadline) || Date.now() < deadline) {
                        return;
                    }

                    transaction.update(lobbyReference, {
                        gamePhase: 'night',
                        dayEndVotes: []
                    });
                });
            } catch (error) {
                console.error(error);
            } finally {
                dayTransitionInProgress = false;
            }
        }

        async function castDayEndVote() {
            if (!currentLobbyId || !currentPlayer) {
                return;
            }

            try {
                await runTransaction(db, async function(transaction) {
                    const lobbyReference = doc(db, gamesCollectionName, currentLobbyId);
                    const lobbySnapshot = await transaction.get(lobbyReference);
                    const lobby = lobbySnapshot.data();

                    if (!lobby || lobby.gameIsRunning !== true || (lobby.gamePhase || 'day') !== 'day') {
                        return;
                    }

                    const players = Array.isArray(lobby.players) ? lobby.players : [];
                    const eliminatedPlayerIds = Array.isArray(lobby.eliminatedPlayerIds) ? lobby.eliminatedPlayerIds : [];
                    const livingPlayers = players.filter(function(player) {
                        return !eliminatedPlayerIds.includes(player.id);
                    });
                    if (!livingPlayers.some(function(player) { return player.id === currentPlayer.id; })) {
                        return;
                    }

                    const livingPlayerIds = livingPlayers.map(function(player) { return player.id; });
                    const votes = Array.isArray(lobby.dayEndVotes) ? lobby.dayEndVotes.filter(function(voterId) {
                        return livingPlayerIds.includes(voterId);
                    }) : [];
                    const updatedVotes = votes.includes(currentPlayer.id)
                        ? votes.filter(function(voterId) { return voterId !== currentPlayer.id; })
                        : votes.concat(currentPlayer.id);
                    const majority = Math.floor(livingPlayers.length / 2) + 1;
                    const updates = { dayEndVotes: updatedVotes };

                    if (updatedVotes.length >= majority) {
                        updates.gamePhase = 'night';
                        updates.dayEndVotes = [];
                    }

                    transaction.update(lobbyReference, updates);
                });
            } catch (error) {
                gameMessage.textContent = 'Impossible d’enregistrer votre vote.';
                console.error(error);
            }
        }

        function subscribeToSystemMessages(lobbyId) {
            if (stopSystemMessagesListener) {
                stopSystemMessagesListener();
            }

            systemFeed.innerHTML = '';
            if (!currentPlayer) {
                return;
            }

            const messagesQuery = query(
                collection(db, gamesCollectionName, lobbyId, 'players', currentPlayer.id, 'systemMessages'),
                orderBy('createdAt')
            );
            stopSystemMessagesListener = onSnapshot(messagesQuery, function(snapshot) {
                systemFeed.innerHTML = '';
                if (snapshot.empty) {
                    const emptyMessage = document.createElement('li');
                    emptyMessage.className = 'system-empty';
                    emptyMessage.textContent = 'Aucune information du système pour le moment.';
                    systemFeed.appendChild(emptyMessage);
                    return;
                }

                snapshot.forEach(function(messageSnapshot) {
                    const messageData = messageSnapshot.data();
                    const messageItem = document.createElement('li');
                    if (messageData.createdAt && typeof messageData.createdAt.toDate === 'function') {
                        const messageTime = document.createElement('time');
                        messageTime.dateTime = messageData.createdAt.toDate().toISOString();
                        messageTime.textContent = new Intl.DateTimeFormat('fr-FR', {
                            hour: '2-digit',
                            minute: '2-digit'
                        }).format(messageData.createdAt.toDate());
                        messageItem.appendChild(messageTime);
                    }
                    messageItem.appendChild(document.createTextNode(messageData.message || ''));
                    systemFeed.appendChild(messageItem);
                });
            }, function(error) {
                console.error(error);
            });
        }

        async function updateSelectedRole(roleName, isSelected) {
            if (!currentLobbyId || !currentPlayer) {
                return;
            }

            try {
                await runTransaction(db, async function(transaction) {
                    const lobbyReference = doc(db, gamesCollectionName, currentLobbyId);
                    const lobbySnapshot = await transaction.get(lobbyReference);
                    const lobby = lobbySnapshot.data();

                    if (!lobby || lobby.hostId !== currentPlayer.id || lobby.gameIsRunning) {
                        throw new Error('CONFIGURATION_INTERDITE');
                    }

                    const selectedRoles = Array.isArray(lobby.selectedRoles) ? lobby.selectedRoles : getAllRoleNames();
                    const updatedRoles = isSelected
                        ? Array.from(new Set(selectedRoles.concat(roleName)))
                        : selectedRoles.filter(function(selectedRole) {
                            return selectedRole !== roleName;
                        });

                    transaction.update(lobbyReference, {
                        selectedRoles: updatedRoles
                    });
                });
            } catch (error) {
                showMessage('Seul l’hôte peut modifier les rôles avant le lancement.');
                try {
                    const lobbySnapshot = await getDoc(doc(db, gamesCollectionName, currentLobbyId));
                    if (lobbySnapshot.exists()) {
                        renderRolePanel(lobbySnapshot.data());
                    }
                } catch (refreshError) {
                    console.error(refreshError);
                }
                console.error(error);
            }
        }

        async function updateRoleCount(categoryKey, value) {
            const count = Number(value);

            if (!Number.isInteger(count) || count < 0 || count > 20) {
                const lobbySnapshot = await getDoc(doc(db, gamesCollectionName, currentLobbyId));
                if (lobbySnapshot.exists()) {
                    renderRoleCounts(lobbySnapshot.data());
                }
                return;
            }

            try {
                await runTransaction(db, async function(transaction) {
                    const lobbyReference = doc(db, gamesCollectionName, currentLobbyId);
                    const lobbySnapshot = await transaction.get(lobbyReference);
                    const lobby = lobbySnapshot.data();

                    if (!lobby || lobby.hostId !== currentPlayer.id || lobby.gameIsRunning) {
                        throw new Error('CONFIGURATION_INTERDITE');
                    }

                    transaction.update(lobbyReference, {
                        ['roleCounts.' + categoryKey]: count
                    });
                });
            } catch (error) {
                showMessage('Seul l’hôte peut modifier le nombre de rôles avant le lancement.');
                console.error(error);
                const lobbySnapshot = await getDoc(doc(db, gamesCollectionName, currentLobbyId));
                if (lobbySnapshot.exists()) {
                    renderRoleCounts(lobbySnapshot.data());
                }
            }
        }

        function validateGameConfiguration(lobby) {
            const selectedRoles = Array.isArray(lobby.selectedRoles) ? lobby.selectedRoles : [];
            const roleCounts = lobby.roleCounts || roleCountDefaults;
            const playersCount = (lobby.players || []).length;
            const townsfolkCount = Number(roleCounts.townsfolk) || 0;
            const outsiderCount = Number(roleCounts.outsider) || 0;
            const minionCount = Number(roleCounts.minion) || 0;
            const expectedPlayersCount = townsfolkCount + outsiderCount + minionCount + 1;
            const validationErrors = [];
            const selectedTownsfolkCount = roleCatalog.townsfolk.roles.filter(function(roleName) {
                return selectedRoles.includes(roleName);
            }).length;
            const selectedOutsiderCount = roleCatalog.outsider.roles.filter(function(roleName) {
                return selectedRoles.includes(roleName);
            }).length;

            if (playersCount !== expectedPlayersCount) {
                validationErrors.push('Joueurs connectés : ' + playersCount + ', alors que ' + expectedPlayersCount + ' sont requis.');
            }

            if (!selectedRoles.includes('Diable')) {
                validationErrors.push('Le rôle Diable doit être coché.');
            }

            if (selectedTownsfolkCount < townsfolkCount + 3) {// Pour que le Diable puisse être choisi, il faut au moins 3 Villageois de plus que le nombre de Villageois requis.
                validationErrors.push('il faut au moins ' + (townsfolkCount + 3) + ' Villageois coché(s).');
            }

            const categoryRules = [
                ['townsfolk', 'Villageois'],
                ['outsider', 'Paria'],
                ['minion', 'Sbire']
            ];
            categoryRules.forEach(function(rule) {
                const categoryKey = rule[0];
                const categoryLabel = rule[1];
                const selectedCount = roleCatalog[categoryKey].roles.filter(function(roleName) {
                    return selectedRoles.includes(roleName);
                }).length;
                const requiredCount = Number(roleCounts[categoryKey]) || 0;

                if (selectedCount < requiredCount) {
                    validationErrors.push(categoryLabel + ' : ' + selectedCount + ' rôle(s) coché(s) pour ' + requiredCount + ' requis.');
                }
            });

            if (selectedRoles.includes('Baron') && townsfolkCount < 2) {//Si le Baron est choisi, il faut pouvoir transformer 2 Villageois en Paria.
                validationErrors.push('Baron sélectionné : il faut au moins 2 Villageois.');
            }

            if (selectedRoles.includes('Baron') && selectedOutsiderCount < outsiderCount + 2) {//Si le Baron est choisi, il faut au moins 2 Paria disponible de plus que le nombre de Paria obligatoirement présent.
                validationErrors.push('Baron sélectionné : il faut au moins ' + (outsiderCount + 2) + ' Paria coché(s).');
            }

            if (selectedRoles.includes('Ivrogne') && selectedTownsfolkCount < townsfolkCount + 4) {//Si l'Ivrogne est choisi, il doit croire qu'il est un Villageois autre que les 3 Villageois montré au Diable
                validationErrors.push('Ivrogne sélectionné : il faut au moins ' + (townsfolkCount + 4) + ' Villageois coché(s).');
            }

            if ((selectedRoles.includes('Lavandiere') || selectedRoles.includes('Vierge')) && townsfolkCount < 2) {///Ces deux roles sont des Villageois qui ont besoin de la présence d'au moins un autre Villageois pour être jouable.
                validationErrors.push('Lavandiere ou Vierge sélectionnée : il faut au moins 2 Villageois.');
            }

            if (selectedRoles.includes('Libraire') && outsiderCount < 1) {//Le Libraire est un Villageois qui a besoin de la présence d'au moins un Paria pour être jouable.
                validationErrors.push('Libraire sélectionné : il faut au moins 1 Paria.');
            }

            if ((selectedRoles.includes('Enqueteur') || selectedRoles.includes('Chef')) && minionCount < 1) {//Ces deux roles sont des Villageois qui ont besoin de la présence d'au moins un Sbire pour être jouable.
                validationErrors.push('Enqueteur ou Chef sélectionné : il faut au moins 1 Sbire.');
            }

            if((townsfolkCount + outsiderCount) <= (minionCount + 1)) {//S'il y a trop de Sbires par rapport au nombre de Villageois et Paria, la partie est impossible a gagner pour le village.
                validationErrors.push('Le nombre de Villageois et Paria doit être supérieur au nombre de Sbires + 1.');
            }

            return validationErrors;
        }

        function subscribeToLobby(lobbyId) {
            if (stopLobbyListener) {
                stopLobbyListener();
            }

            currentLobbyId = lobbyId;
            sessionStorage.setItem('botc-lobby-id', lobbyId);
            stopLobbyListener = onSnapshot(doc(db, gamesCollectionName, lobbyId), function(snapshot) {
                if (!snapshot.exists()) {
                    leaveLobbyView();
                    showMessage('Cette partie n’est plus disponible.');
                    return;
                }

                renderLobby(snapshot.data());
            }, function() {
                showMessage('Impossible de suivre les changements du lobby.');
            });
        }

        function enterLobby(lobbyId, player) {
            currentPlayer = player;
            homeView.classList.add('hidden');
            lobbyView.classList.remove('hidden');
            gameView.classList.add('hidden');
            showMessage('');
            subscribeToLobby(lobbyId);
            subscribeToSystemMessages(lobbyId);
        }

        function leaveLobbyView() {
            if (stopLobbyListener) {
                stopLobbyListener();
                stopLobbyListener = null;
            }

            if (stopSystemMessagesListener) {
                stopSystemMessagesListener();
                stopSystemMessagesListener = null;
            }

            stopDayTimer();

            currentLobbyId = '';
            currentPlayer = null;
            sessionStorage.removeItem('botc-lobby-id');
            lobbyView.classList.add('hidden');
            gameView.classList.add('hidden');
            homeView.classList.remove('hidden');
        }

        async function ensureSignedIn() {
            if (!auth.currentUser) {
                await signInAnonymously(auth);
            }
        }

        function createPlayerData(pseudo) {
            return {
                pseudo: pseudo,
                isAlive: true,
                role: '',
                secondaryRole: '',
                lastVote: false,
                createdAt: serverTimestamp()
            };
        }

        function getPlayerReference(lobbyId) {
            return doc(db, gamesCollectionName, lobbyId, 'players', playerId);
        }

        async function cleanOldGames() {
            const expirationDate = new Date(Date.now() - 6 * 60 * 60 * 1000);
            const oldGamesQuery = query(
                collection(db, gamesCollectionName),
                where('createdAt', '<', expirationDate)
            );
            const oldGamesSnapshot = await getDocs(oldGamesQuery);

            for (const gameDocument of oldGamesSnapshot.docs) {
                const playersSnapshot = await getDocs(
                    collection(db, gamesCollectionName, gameDocument.id, 'players')
                );

                if (playersSnapshot.empty) {
                    await deleteDoc(gameDocument.ref);
                    continue;
                }

                for (let index = 0; index < playersSnapshot.docs.length; index += 450) {
                    const batch = writeBatch(db);
                    const playerDocuments = playersSnapshot.docs.slice(index, index + 450);

                    playerDocuments.forEach(function(playerDocument) {
                        batch.delete(playerDocument.ref);
                    });

                    if (index + 450 >= playersSnapshot.docs.length) {
                        batch.delete(gameDocument.ref);
                    }

                    await batch.commit();
                }
            }
        }

        document.getElementById('create-game').addEventListener('click', async function(e) {
            e.preventDefault();
            const pseudo = pseudoInput.value.trim();
            let password = passwordInput.value.trim();

            if (!pseudo) {
                showMessage('Veuillez entrer votre pseudo avant de créer une partie.');
                pseudoInput.focus();
                return;
            }

            if (!password) {
                password = Math.random().toString(36).slice(2, 8).toUpperCase();
                passwordInput.value = password;
            }

            try {
                await ensureSignedIn();
                await cleanOldGames();
                const player = { id: playerId, pseudo: pseudo };
                const lobbyReference = doc(collection(db, gamesCollectionName));
                await runTransaction(db, async function(transaction) {
                    transaction.set(lobbyReference, {
                        password: password,
                        hostId: playerId,
                        players: [player],
                        createdAt: serverTimestamp(),
                        gameIsRunning: false,
                        roleCounts: roleCountDefaults,
                        selectedRoles: getAllRoleNames()
                    });
                    transaction.set(getPlayerReference(lobbyReference.id), createPlayerData(pseudo));
                });
                enterLobby(lobbyReference.id, player);
            } catch (error) {
                showMessage('Impossible de créer la partie. Vérifiez la configuration Firebase.');
                console.error(error);
            }
        });

        joinForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const pseudo = pseudoInput.value.trim();
            const password = passwordInput.value.trim();

            if (!pseudo || !password) {
                showMessage('Veuillez entrer votre pseudo et le mot de passe de la partie.');
                return;
            }

            try {
                await ensureSignedIn();
                const lobbyQuery = query(
                    collection(db, gamesCollectionName),
                    where('password', '==', password),
                    limit(1)
                );
                const lobbySnapshot = await getDocs(lobbyQuery);

                if (lobbySnapshot.empty) {
                    showMessage('Aucune partie ne correspond à ce mot de passe.');
                    return;
                }

                const lobbyDocument = lobbySnapshot.docs[0];
                const player = { id: playerId, pseudo: pseudo };
                await runTransaction(db, async function(transaction) {
                    const lobbyReference = doc(db, gamesCollectionName, lobbyDocument.id);
                    const currentLobby = await transaction.get(lobbyReference);
                    const lobbyData = currentLobby.data();
                    const players = lobbyData.players || [];

                    if (lobbyData.gameIsRunning === true) {
                        throw new Error('PARTIE_DEJA_LANCEE');
                    }

                    if (players.some(function(existingPlayer) {
                        return existingPlayer.pseudo.toLowerCase() === pseudo.toLowerCase();
                    })) {
                        throw new Error('PSEUDO_DEJA_UTILISE');
                    }

                    transaction.update(lobbyReference, {
                        players: players.concat(player)
                    });
                    transaction.set(getPlayerReference(lobbyDocument.id), createPlayerData(pseudo));
                });
                enterLobby(lobbyDocument.id, player);
            } catch (error) {
                if (error.message === 'PSEUDO_DEJA_UTILISE') {
                    showMessage('Ce pseudo est déjà utilisé dans le lobby.');
                } else if (error.message === 'PARTIE_DEJA_LANCEE') {
                    showMessage('Cette partie a déjà été lancée.');
                } else {
                    showMessage('Impossible de rejoindre la partie. Vérifiez le mot de passe.');
                    console.error(error);
                }
            }
        });

        startGameButton.addEventListener('click', async function() {
            if (!currentLobbyId || !currentPlayer) {
                return;
            }

            try {
                await runTransaction(db, async function(transaction) {
                    const lobbyReference = doc(db, gamesCollectionName, currentLobbyId);
                    const lobbySnapshot = await transaction.get(lobbyReference);
                    const lobby = lobbySnapshot.data();

                    if (!lobby || lobby.hostId !== currentPlayer.id) {
                        throw new Error('HOTE_REQUIS');
                    }

                    if (lobby.gameIsRunning === true) {
                        return;
                    }

                    /* MODE TEST TEMPORAIRE : réactiver ces validations avant les vraies parties.
                    const validationErrors = validateGameConfiguration(lobby);
                    if (validationErrors.length > 0) {
                        const validationError = new Error('CONFIGURATION_INVALIDE');
                        validationError.validationErrors = validationErrors;
                        throw validationError;
                    }
                    */

                    transaction.update(lobbyReference, {
                        gameIsRunning: true,
                        gamePhase: 'day',
                        dayEndsAt: Date.now() + dayDurationMs,
                        dayEndVotes: [],
                        eliminatedPlayerIds: []
                    });
                });
            } catch (error) {
                if (error.message === 'CONFIGURATION_INVALIDE') {
                    showMessage('Partie impossible à lancer : ' + error.validationErrors.join(' '));
                } else {
                    showMessage('Seul l’hôte peut lancer la partie.');
                }
                console.error(error);
            }
        });

        voteDayEndButton.addEventListener('click', castDayEndVote);

        document.getElementById('leave-lobby').addEventListener('click', async function() {
            if (!currentLobbyId || !currentPlayer) {
                leaveLobbyView();
                return;
            }

            try {
                const lobbyReference = doc(db, gamesCollectionName, currentLobbyId);
                const lobbySnapshot = await getDoc(lobbyReference);
                const lobby = lobbySnapshot.exists() ? lobbySnapshot.data() : null;

                await deleteDoc(getPlayerReference(currentLobbyId));

                if (lobby && lobby.hostId === currentPlayer.id) {
                    await deleteDoc(lobbyReference);
                } else {
                    await updateDoc(lobbyReference, {
                        players: arrayRemove(currentPlayer)
                    });
                }
            } catch (error) {
                console.error(error);
            } finally {
                leaveLobbyView();
            }
        });

        ensureSignedIn().then(function() {
            const savedLobbyId = sessionStorage.getItem('botc-lobby-id');
            if (savedLobbyId) {
                const lobbyReference = doc(db, gamesCollectionName, savedLobbyId);
                getDoc(lobbyReference).then(function(snapshot) {
                    const lobby = snapshot.data();
                    const savedPlayer = lobby && (lobby.players || []).find(function(player) {
                        return player.id === playerId;
                    });

                    if (savedPlayer) {
                        enterLobby(savedLobbyId, savedPlayer);
                    }
                }).catch(function(error) {
                    console.error(error);
                });
            }
        }).catch(function(error) {
            showMessage('Connexion à Firebase impossible.');
            console.error(error);
        });
    </script>
