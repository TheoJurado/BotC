<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Clocktower en Ligne</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e94560;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #16213e;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .lobby-layout {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 1.5rem;
            width: min(900px, 100%);
        }
        .lobby-container {
            flex: 1 1 400px;
        }
        .roles-panel {
            flex: 0 1 330px;
            max-height: calc(100vh - 4rem);
            overflow-y: auto;
            text-align: left;
        }
        .roles-panel::-webkit-scrollbar {
            width: 8px;
        }
        .roles-panel::-webkit-scrollbar-thumb {
            background-color: #533483;
            border-radius: 4px;
        }
        .roles-panel h2 {
            margin-top: 0;
            color: #e94560;
            text-align: center;
        }
        .role-counts {
            margin-bottom: 1rem;
            padding: 0.75rem;
            background-color: rgba(15, 52, 96, 0.65);
        }
        .role-count {
            display: grid;
            grid-template-columns: 1fr 4.5rem;
            align-items: center;
            gap: 0.75rem;
            margin: 0.45rem 0;
            color: white;
            font-size: 0.9rem;
        }
        .role-count input {
            width: 4.5rem;
            padding: 0.45rem;
            text-align: center;
        }
        .role-category {
            margin-top: 1.25rem;
        }
        .role-category h3 {
            margin: 0 0 0.5rem;
            color: #86b8e8;
            font-size: 1rem;
        }
        .role-category.minion h3,
        .role-category.demon h3 {
            color: #e94560;
        }
        .role-option {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.35rem 0;
            color: white;
            font-size: 0.9rem;
        }
        .role-option input {
            width: auto;
            accent-color: #e94560;
        }
        .role-option input:not(:disabled) {
            cursor: pointer;
        }
        @media (max-width: 720px) {
            body {
                align-items: flex-start;
                height: auto;
                min-height: 100vh;
                padding: 1rem 0;
            }
            .lobby-layout {
                flex-direction: column;
                align-items: stretch;
                width: 100%;
            }
            .roles-panel {
                max-height: 420px;
            }
        }
        .hidden {
            display: none;
        }
        h1 {
            margin-bottom: 1.5rem;
            color: #e94560;
        }
        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 5px;
            background-color: #0f3460;
            color: white;
            box-sizing: border-box;
        }
        input:focus {
            outline: 2px solid #e94560;
        }
        button {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 5px;
            background-color: #e94560;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 1rem;
        }
        button:hover {
            background-color: #cf3a54;
        }
        .footer {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #533483;
        }
        .footer a {
            color: inherit;
            text-decoration: none;
        }
        .message {
            min-height: 1.2rem;
            margin: 1rem 0 0;
            color: #f5c542;
            font-size: 0.9rem;
        }
        .lobby-password {
            margin: 1rem 0;
            padding: 0.8rem;
            background-color: #0f3460;
            color: white;
            font-weight: bold;
            letter-spacing: 0.08rem;
        }
        .players {
            margin: 1.5rem 0;
            padding: 0;
            color: white;
            list-style: none;
        }
        .players li {
            padding: 0.45rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
        .game-layout {
            width: min(1500px, 100vw);
            height: 100vh;
            padding: 1rem;
            display: grid;
            grid-template-columns: minmax(220px, 1fr) minmax(360px, 1.6fr) minmax(220px, 1fr);
            grid-template-rows: auto minmax(0, 1fr) minmax(180px, 28vh);
            grid-template-areas:
                "accusation timer roles"
                "accusation players roles"
                "accusation system roles";
            gap: 1rem;
        }
        .game-layout.hidden {
            display: none;
        }
        .game-timer {
            grid-area: timer;
            align-self: center;
            text-align: center;
        }
        .game-phase {
            margin: 0 0 0.2rem;
            color: #86b8e8;
            font-weight: 700;
        }
        .game-timer output {
            color: #f5c542;
            font-size: 2.25rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .game-players,
        .game-roles,
        .system-chat,
        .accusation-panel {
            min-width: 0;
            background-color: #16213e;
            border-radius: 8px;
        }
        .accusation-panel {
            grid-area: accusation;
            align-self: start;
            padding: 1rem;
        }
        .accusation-panel h2 {
            margin: 0 0 0.65rem;
            color: #e94560;
            font-size: 1rem;
        }
        .accusation-description,
        .accusation-vote-count {
            margin: 0.55rem 0;
            color: white;
        }
        .accusation-countdown {
            display: block;
            color: #f5c542;
            font-size: 1.6rem;
            font-variant-numeric: tabular-nums;
            text-align: center;
        }
        .vote-switch {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            width: auto;
            margin: 0.5rem 0 0;
            padding: 0.35rem 0;
            background: transparent;
            color: white;
        }
        .vote-switch-track {
            width: 2.75rem;
            height: 1.5rem;
            display: inline-flex;
            align-items: center;
            padding: 0.15rem;
            border-radius: 999px;
            background: #49546b;
            transition: background-color 0.2s;
        }
        .vote-switch-thumb {
            width: 1.2rem;
            height: 1.2rem;
            border-radius: 50%;
            background: white;
            transition: transform 0.2s;
        }
        .vote-switch[aria-checked="true"] .vote-switch-track {
            background: #268b68;
        }
        .vote-switch[aria-checked="true"] .vote-switch-thumb {
            transform: translateX(1.25rem);
        }
        .vote-switch:disabled {
            color: #9ba6bb;
            cursor: not-allowed;
        }
        .accusation-status {
            min-height: 1.1rem;
            margin: 0.4rem 0 0;
            color: #f5c542;
            font-size: 0.8rem;
        }
        .game-players {
            grid-area: players;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }
        .game-section-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
        }
        .game-section-heading h1,
        .game-roles h2,
        .system-chat h2 {
            margin: 0;
            font-size: 1.2rem;
        }
        .game-section-heading p {
            margin: 0;
            color: #86b8e8;
            text-align: right;
        }
        .game-player-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            margin: 0.75rem 0 0;
            padding: 0;
            list-style: none;
            color: white;
        }
        .game-player-row {
            display: grid;
            grid-template-columns: 1.5rem 1.5rem auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 0.6rem;
            min-height: 2.6rem;
            padding: 0.35rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
        .accusation-button {
            width: auto;
            min-width: 5.5rem;
            margin: 0;
            padding: 0.45rem 0.55rem;
            font-size: 0.75rem;
        }
        .accusation-button:disabled {
            background-color: #49546b;
            cursor: not-allowed;
        }
        .player-skull {
            color: #e94560;
            text-align: center;
        }
        .player-last-vote {
            text-align: center;
        }
        .player-state {
            color: #86b8e8;
            font-size: 0.8rem;
        }
        .game-vote-button {
            flex: 0 0 auto;
            width: 100%;
            margin-top: 0.75rem;
        }
        .game-player-actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
        }
        .game-message {
            min-height: 1.2rem;
            margin: 0.4rem 0 0;
            color: #f5c542;
            font-size: 0.85rem;
            text-align: center;
        }
        .game-roles {
            grid-area: roles;
            min-height: 0;
            overflow-y: auto;
            padding: 1.25rem;
        }
        .game-roles h2 {
            text-align: center;
        }
        .game-role-category {
            margin-top: 1.2rem;
        }
        .game-role-category h3 {
            margin: 0 0 0.45rem;
            color: #86b8e8;
            font-size: 0.95rem;
        }
        .game-role-category.minion h3,
        .game-role-category.demon h3 {
            color: #e94560;
        }
        .game-role-category ul {
            margin: 0;
            padding-left: 1.2rem;
            color: white;
        }
        .game-role-category li {
            padding: 0.2rem 0;
        }
        .system-chat {
            grid-area: system;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 0.9rem 1rem;
        }
        .system-feed {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            margin: 0.55rem 0 0;
            padding: 0;
            list-style: none;
            color: white;
        }
        .system-feed li {
            padding: 0.45rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            overflow-wrap: anywhere;
        }
        .system-feed time {
            margin-right: 0.5rem;
            color: #86b8e8;
            font-size: 0.8rem;
        }
        .system-feed .system-empty {
            color: #b8c3d8;
            font-style: italic;
        }
        @media (max-width: 850px) {
            body {
                height: auto;
                min-height: 100vh;
            }
            .game-layout {
                width: 100%;
                flex: 0 0 100%;
                height: auto;
                min-height: 100vh;
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto minmax(260px, 1fr) minmax(190px, 30vh) auto;
                grid-template-areas:
                    "timer"
                    "players"
                    "system"
                    "accusation"
                    "roles";
            }
            .game-roles {
                max-height: 360px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="home-view">
        <h1>Blood on the Clocktower</h1>
        <form id="join-form">
            <div class="form-group">
                <label for="pseudo">Votre Pseudo</label>
                <input type="text" id="pseudo" name="pseudo" placeholder="Ex: Jean_Michel" required>
            </div>
            <div class="form-group">
                <label for="game-password">Mot de passe de la partie</label>
                <input type="password" id="game-password" name="game-password" placeholder="Mot de passe commun" required>
            </div>
            <button type="submit">Rejoindre la partie</button>
        </form>
        <p class="message" id="message" role="status"></p>
        <div class="footer">
            <a href="#" id="create-game">Créer une partie</a>
        </div>
    </div>

    <div class="lobby-layout hidden" id="lobby-view">
        <div class="container lobby-container">
            <h1>Lobby</h1>
            <p>Mot de passe de la partie :</p>
            <div class="lobby-password" id="lobby-password"></div>
            <h2>Joueurs connectés</h2>
            <ul class="players" id="players-list"></ul>
            <button type="button" id="start-game">Lancer la partie</button>
            <button type="button" id="leave-lobby">Quitter le lobby</button>
            <p class="message" id="lobby-message" role="status"></p>
        </div>
        <aside class="container roles-panel" aria-labelledby="roles-title">
            <h2 id="roles-title">Configuration des rôles</h2>
            <div class="role-counts" id="role-counts"></div>
            <div id="roles-list"></div>
        </aside>
    </div>

    <main class="game-layout hidden" id="game-view" aria-label="Partie en cours">
        <header class="game-timer">
            <p class="game-phase" id="game-phase-label">Jour en cours</p>
            <output id="game-timer-value" aria-live="polite">05:00</output>
        </header>
        <section class="game-players" aria-labelledby="game-players-title">
            <div class="game-section-heading">
                <h1 id="game-players-title">Joueurs</h1>
                <p id="day-vote-count"></p>
            </div>
            <ul class="game-player-list" id="game-players-list"></ul>
            <div class="game-player-actions">
                <button class="game-vote-button" type="button" id="vote-day-end">Voter pour la fin de journée</button>
                <button class="game-vote-button hidden" type="button" id="start-day">Le jour se lève</button>
            </div>
            <p class="game-message" id="game-message" role="status"></p>
        </section>
        <aside class="accusation-panel hidden" id="accusation-panel" aria-labelledby="accusation-title">
            <h2 id="accusation-title">Vote d’accusation</h2>
            <p class="accusation-description" id="accusation-description"></p>
            <output class="accusation-countdown" id="accusation-countdown" aria-live="polite">02:00</output>
            <p class="accusation-vote-count" id="accusation-vote-count"></p>
            <button class="vote-switch" id="accusation-vote-switch" type="button" role="switch" aria-checked="false">
                <span class="vote-switch-track" aria-hidden="true"><span class="vote-switch-thumb"></span></span>
                <span id="accusation-vote-label">Mon vote : OFF</span>
            </button>
            <p class="accusation-status" id="accusation-status" role="status"></p>
        </aside>
        <aside class="game-roles" aria-labelledby="game-roles-title">
            <h2 id="game-roles-title">Rôles possibles</h2>
            <div id="game-roles-list"></div>
        </aside>
        <section class="system-chat" aria-labelledby="system-chat-title">
            <h2 id="system-chat-title">Journal personnel</h2>
            <ol class="system-feed" id="system-feed" aria-live="polite"></ol>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
        import {
            arrayRemove,
            collection,
            deleteDoc,
            doc,
            getDoc,
            getDocs,
            getFirestore,
            limit,
            onSnapshot,
            orderBy,
            query,
            runTransaction,
            serverTimestamp,
            updateDoc,
            where,
            writeBatch
        } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyARy2cLQeecGdapyUsp0C3fgeUWXi5Thg4',
            authDomain: 'botc-database-gamemaster.firebaseapp.com',
            projectId: 'botc-database-gamemaster',
            storageBucket: 'botc-database-gamemaster.firebasestorage.app',
            messagingSenderId: '1089060485131',
            appId: '1:1089060485131:web:21c8fa56a336901ddc6f0e'
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const homeView = document.getElementById('home-view');
        const lobbyView = document.getElementById('lobby-view');
        const gameView = document.getElementById('game-view');
        const joinForm = document.getElementById('join-form');
        const pseudoInput = document.getElementById('pseudo');
        const passwordInput = document.getElementById('game-password');
        const message = document.getElementById('message');
        const lobbyMessage = document.getElementById('lobby-message');
        const lobbyPassword = document.getElementById('lobby-password');
        const playersList = document.getElementById('players-list');
        const startGameButton = document.getElementById('start-game');
        const roleCounts = document.getElementById('role-counts');
        const rolesList = document.getElementById('roles-list');
        const gamePhaseLabel = document.getElementById('game-phase-label');
        const gameTimerValue = document.getElementById('game-timer-value');
        const gamePlayersList = document.getElementById('game-players-list');
        const gameRolesList = document.getElementById('game-roles-list');
        const dayVoteCount = document.getElementById('day-vote-count');
        const voteDayEndButton = document.getElementById('vote-day-end');
        const startDayButton = document.getElementById('start-day');
        const gameMessage = document.getElementById('game-message');
        const accusationPanel = document.getElementById('accusation-panel');
        const accusationDescription = document.getElementById('accusation-description');
        const accusationCountdown = document.getElementById('accusation-countdown');
        const accusationVoteCount = document.getElementById('accusation-vote-count');
        const accusationVoteSwitch = document.getElementById('accusation-vote-switch');
        const accusationVoteLabel = document.getElementById('accusation-vote-label');
        const accusationStatus = document.getElementById('accusation-status');
        const systemFeed = document.getElementById('system-feed');
        const gamesCollectionName = 'games';
        const dayDurationMs = 1 * 60 * 1000;//15 minutes //Mais la c'est 1 min pour les tests
        const accusationDurationMs = 0.25 * 60 * 1000;//2 minutes //Mais la c'est 15 sec pour les tests
        const roleCountDefaults = {
            townsfolk: 3,
            outsider: 2,
            minion: 2
        };
        const roleCatalog = {
            townsfolk: {
                label: 'Villageois (Townsfolk)',
                roles: ['Lavandiere', 'Libraire', 'Enqueteur', 'Chef', 'Empatique', 'Voyante', 'Croque-mort', 'Moine', 'Gardien', 'Mercenaire', 'Vierge', 'Soldat', 'Maire']
            },
            outsider: {
                label: 'Paria (Outsider)',
                roles: ['Majordome', 'Ivrogne', 'Recluse', 'Saint']
            },
            minion: {
                label: 'Sbire (Minion)',
                roles: ['Empoisonneur', 'Espion', 'Femme fatale', 'Baron']
            },
            demon: {
                label: 'Démon (Demon)',
                roles: ['Diable']
            }
        };
        const playerId = sessionStorage.getItem('botc-player-id') || crypto.randomUUID();
        let currentPlayer = null;
        let currentLobbyId = '';
        let stopLobbyListener = null;
        let stopSystemMessagesListener = null;
        let countdownInterval = null;
        let currentDayDeadline = null;
        let dayTransitionInProgress = false;
        let accusationInterval = null;
        let currentAccusationId = null;
        let accusationResolutionInProgress = false;

        sessionStorage.setItem('botc-player-id', playerId);

        function showMessage(text) {
            message.textContent = text;
            lobbyMessage.textContent = text;
        }

        function getAllRoleNames() {
            return Object.values(roleCatalog).flatMap(function(category) {
                return category.roles;
            });
        }

        function renderRoleCounts(lobby) {
            const counts = lobby.roleCounts || roleCountDefaults;
            const canEditCounts = Boolean(currentPlayer && currentPlayer.id === lobby.hostId && !lobby.gameIsRunning);
            roleCounts.innerHTML = '';

            Object.entries(roleCountDefaults).forEach(function(entry) {
                const categoryKey = entry[0];
                const categoryLabel = roleCatalog[categoryKey].label.split(' (')[0];
                const countLabel = document.createElement('label');
                const countInput = document.createElement('input');

                countLabel.className = 'role-count';
                countLabel.textContent = categoryLabel;
                countInput.type = 'number';
                countInput.min = '0';
                countInput.max = '20';
                countInput.step = '1';
                countInput.inputMode = 'numeric';
                countInput.value = Number.isInteger(counts[categoryKey]) ? counts[categoryKey] : roleCountDefaults[categoryKey];
                countInput.disabled = !canEditCounts;
                countInput.addEventListener('change', function() {
                    updateRoleCount(categoryKey, countInput.value);
                });
                countLabel.appendChild(countInput);
                roleCounts.appendChild(countLabel);
            });
        }

        function renderRolePanel(lobby) {
            const selectedRoles = lobby.selectedRoles || getAllRoleNames();
            const canEditRoles = Boolean(currentPlayer && currentPlayer.id === lobby.hostId && !lobby.gameIsRunning);
            rolesList.innerHTML = '';

            Object.entries(roleCatalog).forEach(function(entry) {
                const categoryKey = entry[0];
                const category = entry[1];
                const categoryElement = document.createElement('section');
                categoryElement.className = 'role-category ' + categoryKey;

                const categoryTitle = document.createElement('h3');
                categoryTitle.textContent = category.label;
                categoryElement.appendChild(categoryTitle);

                category.roles.forEach(function(roleName) {
                    const roleLabel = document.createElement('label');
                    const roleCheckbox = document.createElement('input');
                    const roleText = document.createElement('span');

                    roleLabel.className = 'role-option';
                    roleCheckbox.type = 'checkbox';
                    roleCheckbox.checked = selectedRoles.includes(roleName);
                    roleCheckbox.disabled = !canEditRoles;
                    roleText.textContent = roleName;
                    roleCheckbox.addEventListener('change', function() {
                        updateSelectedRole(roleName, roleCheckbox.checked);
                    });
                    roleLabel.appendChild(roleCheckbox);
                    roleLabel.appendChild(roleText);
                    categoryElement.appendChild(roleLabel);
                });

                rolesList.appendChild(categoryElement);
            });
        }

        function renderLobby(lobby) {
            const gameIsRunning = lobby.gameIsRunning === true;

            lobbyView.classList.toggle('hidden', gameIsRunning);
            gameView.classList.toggle('hidden', !gameIsRunning);
            lobbyPassword.textContent = lobby.password;
            playersList.innerHTML = '';
            startGameButton.classList.toggle('hidden', Boolean(lobby.gameIsRunning) || !currentPlayer || currentPlayer.id !== lobby.hostId);
            renderRoleCounts(lobby);
            renderRolePanel(lobby);

            (lobby.players || []).forEach(function(player) {
                const playerItem = document.createElement('li');
                playerItem.textContent = player.pseudo;
                playersList.appendChild(playerItem);
            });

            if (gameIsRunning) {
                renderGame(lobby);
            } else {
                stopDayTimer();
            }
        }

        function renderGame(lobby) {
            const selectedRoles = Array.isArray(lobby.selectedRoles) ? lobby.selectedRoles : [];
            const phase = lobby.gamePhase || 'day';
            const activeAccusation = lobby.activeAccusation || null;

            gamePhaseLabel.textContent = phase === 'night' ? 'La nuit est tombée' : 'Jour en cours';
            renderGameRoles(selectedRoles);
            renderGamePlayers(lobby, phase);
            renderAccusation(lobby, activeAccusation);

            if (phase === 'night' && lobby.lastDayResult) {
                const result = lobby.lastDayResult;
                const eliminatedPlayer = (lobby.players || []).find(function(player) {
                    return player.id === result.eliminatedPlayerId;
                });
                gameMessage.textContent = result.tied
                    ? 'Égalité avec ' + result.votes + ' votes : personne n’est éliminé.'
                    : eliminatedPlayer
                        ? eliminatedPlayer.pseudo + ' est éliminé avec ' + result.votes + ' votes.'
                        : 'Personne n’est éliminé aujourd’hui.';
            }

            if (phase === 'day' && activeAccusation) {
                stopDayTimer();
                updateTimerDisplay(Number(lobby.pausedDayTimeMs));
                startAccusationTimer(activeAccusation, lobby.hostId);
                voteDayEndButton.disabled = true;
            } else if (phase === 'day') {
                stopAccusationTimer();
                const deadline = lobby.dayEndsAt && typeof lobby.dayEndsAt.toMillis === 'function'
                    ? lobby.dayEndsAt.toMillis()
                    : Number(lobby.dayEndsAt);
                startDayTimer(deadline);
            } else {
                stopDayTimer();
                stopAccusationTimer();
                gameTimerValue.textContent = 'Nuit';
            }

            if (phase === 'day' && !activeAccusation && currentPlayer && currentPlayer.id === lobby.hostId) {
                const players = Array.isArray(lobby.players) ? lobby.players : [];
                const eliminatedPlayerIds = Array.isArray(lobby.eliminatedPlayerIds) ? lobby.eliminatedPlayerIds : [];
                const livingPlayers = players.filter(function(player) { return isPlayerAlive(player, eliminatedPlayerIds); });
                const livingPlayerIds = livingPlayers.map(function(player) { return player.id; });
                const dayEndVotes = Array.isArray(lobby.dayEndVotes) ? lobby.dayEndVotes : [];
                const validDayEndVotes = dayEndVotes.filter(function(voterId) { return livingPlayerIds.includes(voterId); });

                if (validDayEndVotes.length >= Math.floor(livingPlayers.length / 2) + 1) {
                    advanceToNight();
                }
            }
        }

        function renderAccusation(lobby, accusation) {
            if (!accusation) {
                accusationPanel.classList.add('hidden');
                accusationDescription.textContent = '';
                accusationVoteCount.textContent = '';
                accusationVoteSwitch.disabled = true;
                accusationStatus.textContent = '';
                return;
            }

            accusationPanel.classList.remove('hidden');
            const players = Array.isArray(lobby.players) ? lobby.players : [];
            const accuser = players.find(function(player) { return player.id === accusation.accuserId; });
            const target = players.find(function(player) { return player.id === accusation.targetId; });
            const alivePlayers = players.filter(function(player) {
                return isPlayerAlive(player, Array.isArray(lobby.eliminatedPlayerIds) ? lobby.eliminatedPlayerIds : []);
            });
            const votes = accusation.votes && typeof accusation.votes === 'object' ? accusation.votes : {};
            const yesVotes = players.filter(function(player) { return votes[player.id] === true; }).length;
            const majority = Math.floor(alivePlayers.length / 2) + 1;
            const currentPlayerData = players.find(function(player) {
                return currentPlayer && player.id === currentPlayer.id;
            });
            const hasVoted = Boolean(currentPlayer && votes[currentPlayer.id] === true);
            const currentPlayerAlive = Boolean(currentPlayerData && isPlayerAlive(currentPlayerData, Array.isArray(lobby.eliminatedPlayerIds) ? lobby.eliminatedPlayerIds : []));
            const hasFinalVote = Boolean(currentPlayerData && currentPlayerData.lastVote === true);
            const canVote = Boolean(currentPlayerData && (currentPlayerAlive || (hasFinalVote && !hasVoted)));

            accusationDescription.textContent = (accuser ? accuser.pseudo : 'Un joueur') + ' accuse ' + (target ? target.pseudo : 'un joueur');
            accusationVoteCount.textContent = yesVotes + ' voix pour; majorité : ' + majority + ' joueurs vivants';
            accusationVoteSwitch.setAttribute('aria-checked', String(hasVoted));
            accusationVoteSwitch.disabled = !canVote;
            accusationVoteLabel.textContent = currentPlayerAlive
                ? 'Mon vote : ' + (hasVoted ? 'ON' : 'OFF')
                : hasFinalVote
                    ? 'Vote ultime : ' + (hasVoted ? 'ON' : 'OFF')
                    : 'Vote ultime utilisé';
            accusationStatus.textContent = canVote
                ? ''
                : currentPlayerAlive
                    ? 'Vote indisponible.'
                    : 'Ce joueur a déjà utilisé son vote ultime.';
        }

        function updateTimerDisplay(remainingMs) {
            const remainingSeconds = Math.ceil(Math.max(0, remainingMs) / 1000);
            const minutes = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
            const seconds = (remainingSeconds % 60).toString().padStart(2, '0');
            gameTimerValue.textContent = minutes + ':' + seconds;
        }

        function isPlayerAlive(player, eliminatedPlayerIds) {
            return player.isAlive !== false && !eliminatedPlayerIds.includes(player.id);
        }

        function getDayEliminationOutcome(lobby) {
            const players = Array.isArray(lobby.players) ? lobby.players : [];
            const eliminatedPlayerIds = Array.isArray(lobby.eliminatedPlayerIds) ? lobby.eliminatedPlayerIds : [];
            const totals = lobby.accusationTotals && typeof lobby.accusationTotals === 'object'
                ? lobby.accusationTotals
                : {};
            const livingPlayers = players.filter(function(player) {
                return isPlayerAlive(player, eliminatedPlayerIds);
            });
            const highestVoteCount = livingPlayers.reduce(function(highest, player) {
                return Math.max(highest, Number(totals[player.id]) || 0);
            }, 0);
            const leaders = highestVoteCount > 0
                ? livingPlayers.filter(function(player) { return (Number(totals[player.id]) || 0) === highestVoteCount; })
                : [];

            return {
                player: leaders.length === 1 ? leaders[0] : null,
                tied: leaders.length > 1,
                votes: highestVoteCount
            };
        }

        async function finishDayInTransaction(transaction, lobbyReference, lobby) {
            const outcome = getDayEliminationOutcome(lobby);
            const players = Array.isArray(lobby.players) ? lobby.players : [];
            const eliminatedPlayerIds = Array.isArray(lobby.eliminatedPlayerIds) ? lobby.eliminatedPlayerIds : [];
            let eliminatedPlayer = null;

            if (outcome.player) {
                eliminatedPlayer = outcome.player;
            }

            players.forEach(function(player) {
                const playerReference = doc(db, gamesCollectionName, currentLobbyId, 'players', player.id);
                transaction.update(playerReference, player.id === (eliminatedPlayer && eliminatedPlayer.id)
                    ? { canAccuse: true, isAlive: false, lastVote: true }
                    : { canAccuse: true });
            });

            transaction.update(lobbyReference, {
                gamePhase: 'night',
                dayEndVotes: [],
                accusedPlayerIds: [],
                accusationTotals: {},
                activeAccusation: null,
                pausedDayTimeMs: null,
                eliminatedPlayerIds: eliminatedPlayer
                    ? Array.from(new Set(eliminatedPlayerIds.concat(eliminatedPlayer.id)))
                    : eliminatedPlayerIds,
                players: players.map(function(player) {
                    return player.id === (eliminatedPlayer && eliminatedPlayer.id)
                        ? Object.assign({}, player, { canAccuse: true, isAlive: false, lastVote: true })
                        : Object.assign({}, player, { canAccuse: true });
                }),
                lastDayResult: {
                    id: crypto.randomUUID(),
                    eliminatedPlayerId: eliminatedPlayer ? eliminatedPlayer.id : null,
                    votes: outcome.votes,
                    tied: outcome.tied
                }
            });
        }

        function renderGamePlayers(lobby, phase) {
            const players = Array.isArray(lobby.players) ? lobby.players : [];
            const eliminatedPlayerIds = Array.isArray(lobby.eliminatedPlayerIds) ? lobby.eliminatedPlayerIds : [];
            const dayEndVotes = Array.isArray(lobby.dayEndVotes) ? lobby.dayEndVotes : [];
            const livingPlayers = players.filter(function(player) {
                return isPlayerAlive(player, eliminatedPlayerIds);
            });
            const livingPlayerIds = livingPlayers.map(function(player) {
                return player.id;
            });
            const validVotes = dayEndVotes.filter(function(voterId) {
                return livingPlayerIds.includes(voterId);
            });
            const majority = Math.floor(livingPlayers.length / 2) + 1;
            const hasVoted = currentPlayer && validVotes.includes(currentPlayer.id);
            const currentPlayerData = players.find(function(player) {
                return currentPlayer && player.id === currentPlayer.id;
            });
            const isEliminated = currentPlayerData && !isPlayerAlive(currentPlayerData, eliminatedPlayerIds);
            const currentPlayerCanAccuse = Boolean(currentPlayerData && currentPlayerData.canAccuse !== false);
            const currentPlayerAlive = Boolean(currentPlayerData
                && currentPlayerData.isAlive !== false
                && !eliminatedPlayerIds.includes(currentPlayerData.id));
            const canAccuse = currentPlayerCanAccuse && currentPlayerAlive;
            const accusationInProgress = Boolean(lobby.activeAccusation);
            const accusedPlayerIds = Array.isArray(lobby.accusedPlayerIds) ? lobby.accusedPlayerIds : [];
            const accusationTotals = lobby.accusationTotals && typeof lobby.accusationTotals === 'object'

                skullSlot.className = 'player-skull';
                skullSlot.textContent = eliminated ? '💀' : '';
                skullSlot.setAttribute('aria-label', eliminated ? 'Éliminé' : '');
                playerName.textContent = player.pseudo + ' - Vote : ' + (Number(accusationTotals[player.id]) || 0);
                playerState.className = 'player-state';

                playerItem.appendChild(lastVoteSlot);
                playerItem.appendChild(skullSlot);
                playerItem.appendChild(accusationButton);
                playerItem.appendChild(playerName);
                playerItem.appendChild(playerState);
                gamePlayersList.appendChild(playerItem);
            });

            dayVoteCount.textContent = validVotes.length + ' / ' + livingPlayers.length + ' votes; majorité : ' + majority;
            voteDayEndButton.disabled = phase !== 'day' || !currentPlayer || isEliminated;
            if (accusationInProgress) {
                voteDayEndButton.disabled = true;
            }
            voteDayEndButton.textContent = phase !== 'day'
                ? 'La nuit est tombée'
                : hasVoted
                    ? 'Retirer mon vote'
                    : 'Voter pour la fin de journée';
            startDayButton.classList.toggle('hidden', phase !== 'night' || !currentPlayer || currentPlayer.id !== lobby.hostId);
            gameMessage.textContent = '';
